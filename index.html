/* ---------- Design tokens (light / dark) ---------- */
:root{

  }
}
:root[data-theme="dark"]{
  --bg:#0c121c; --surface:#131b28; --surface-2:#18212f; --ink:#e5eaf3; --muted:#9aa5b8; --line:#273246;
  --navy:#0a1222; --navy-ink:#e5eaf3; --accent:#8db3f0; --accent-soft:#1b2a44;
  --emerald:#5fd3a6; --emerald-soft:#123428; --amber:#f2b860; --amber-soft:#3a2a10; --rose:#f4899c; --rose-soft:#3d1720;
  --focus:#8db3f0; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{font-family:"IBM Plex Sans Arabic","Source Serif 4",serif;font-weight:600;letter-spacing:0}
[dir="rtl"] .metric .v,[dir="rtl"] .sc-gpa .v{font-family:"IBM Plex Sans Arabic","Source Serif 4",serif}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy)}
h1,h2,h3{font-family:"Source Serif 4","IBM Plex Sans Arabic",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:1.75rem;line-height:1.2} h2{font-size:1.35rem;line-height:1.25} h3{font-size:1.05rem}
.muted{color:var(--muted)} .small{font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-pad{padding:1.25rem}
@media (min-width:768px){.panel-pad{padding:1.6rem}}
.field label{display:block;font-size:.85rem;font-weight:500;margin-bottom:.3rem}
.input,.select{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:.6rem .7rem;font:inherit}
.password-field{position:relative}
.password-field > input{padding-inline-end:3.5rem}
.password-toggle{position:absolute;inset-inline-end:.3rem;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:center;width:2.65rem;height:2.65rem;border:0;border-radius:7px;color:var(--muted);background:transparent;cursor:pointer;touch-action:manipulation}
.password-toggle:hover{background:var(--surface-2);color:var(--ink)}
.password-toggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.password-toggle[aria-pressed="false"] .password-eye-slash{display:none}
.input:focus,.select:focus,.btn:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border-radius:7px;padding:.55rem .95rem;font:inherit;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .15s}
.btn-primary{background:var(--accent);color:var(--surface)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:.35rem .65rem;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;font-weight:500;padding:.15rem .5rem;border-radius:999px;white-space:nowrap}
.b-em{background:var(--emerald-soft);color:var(--emerald)} .b-am{background:var(--amber-soft);color:var(--amber)}
.b-ro{background:var(--rose-soft);color:var(--rose)} .b-ac{background:var(--accent-soft);color:var(--accent)}
.b-mu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
/* header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:var(--navy-ink)}
/* Benha University logo: embedded image; a light rounded backing keeps its outline visible on the navy header */
.uni-logo{display:block;height:38px;width:auto;background:#fff;border-radius:7px;padding:2px 4px;flex:none}
.topbar .chip{background:rgba(255,255,255,.1);color:var(--navy-ink);border-radius:6px;padding:.2rem .55rem;font-size:.8rem}
/* stepper: a real sequence, so numbered */
.stepper{display:flex;gap:.25rem;overflow-x:auto}
.step{flex:1 0 auto;display:flex;align-items:center;gap:.55rem;padding:.65rem .8rem;border-radius:8px;cursor:pointer;color:var(--muted);background:transparent;border:0;font:inherit;text-align:start}
.step .num{width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:600;border:1.5px solid var(--line)}
.step.done .num{background:var(--emerald);border-color:var(--emerald);color:var(--surface)}
.step.active{background:var(--surface);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.step.active .num{border-color:var(--accent);color:var(--accent)}
.step[disabled]{cursor:not-allowed;opacity:.55}
/* metric strip */
.metric{padding:1rem 1.1rem;border-inline-end:1px solid var(--line)}
.metric:last-child{border-inline-end:0}
.metric .v{font-family:"Source Serif 4",Georgia,serif;font-size:1.65rem;font-weight:600;line-height:1.1}
.metric .k{font-size:.8rem;color:var(--muted)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:start;font-weight:500;color:var(--muted);background:var(--surface-2);padding:.55rem .7rem;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:.55rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.code{font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.01em}
/* tabs */
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:.6rem .9rem;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
/* course cards in advising list */
.course{display:grid;grid-template-columns:1fr auto;gap:.75rem;padding:.85rem 1rem;border-bottom:1px solid var(--line)}
.course:last-child{border-bottom:0}
.prio{border-inline-start:3px solid var(--line);padding-inline-start:.75rem}
.prio.p1{border-inline-start-color:var(--rose)} .prio.p2{border-inline-start-color:var(--accent)} .prio.p3{border-inline-start-color:var(--emerald)}
/* credit gauge: the one bold element */
.gauge{height:14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden}
.gauge .fill{position:absolute;inset-block:0;inset-inline-start:0;background:var(--emerald);transition:width .35s ease}
.gauge .fill.warn{background:var(--amber)} .gauge .fill.over{background:var(--rose)}
.gauge .minmark{position:absolute;inset-block:0;width:2px;background:var(--ink);opacity:.35}
.dropzone{border:1.5px dashed var(--line);border-radius:10px;padding:1.3rem;text-align:center;cursor:pointer;background:var(--surface-2)}
.dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
.alert{border-radius:8px;padding:.75rem .9rem;font-size:.9rem;border:1px solid}
.alert-ro{background:var(--rose-soft);color:var(--rose);border-color:transparent}
.alert-am{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.alert-em{background:var(--emerald-soft);color:var(--emerald);border-color:transparent}
.alert-ac{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.otp{display:flex;gap:.5rem;justify-content:center}
.otp input{width:2.6rem;height:3rem;text-align:center;font-size:1.3rem;font-weight:600}
/* modal: in-flow overlay */
.modal-back{position:fixed;inset:0;background:rgba(8,14,26,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1rem);overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;max-width:960px;width:100%;border:1px solid var(--line)}

.hidden{display:none!important}
.grid>*{min-width:0}

.pmap-wrap{overflow-x:auto}

.pcol h4{font-size:.8rem;color:var(--muted);font-weight:500;margin:0 0 .5rem}
.pcard{display:block;width:100%;text-align:start;font:inherit;font-size:.78rem;line-height:1.3;padding:.4rem .55rem;margin-bottom:.4rem;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;position:relative;z-index:1}
.pcard b{display:block;font-size:.8rem}

.pcard.s-fail{background:var(--rose-soft);border-color:var(--rose)}
.pcard.s-elig{border-color:var(--accent)}
.pcard.s-block{color:var(--muted);border-style:dashed}
.pcard.sel{outline:2.5px solid var(--ink);outline-offset:1px}
.pcard.pre{box-shadow:0 0 0 2.5px var(--amber)}
.pcard.unl{box-shadow:0 0 0 2.5px var(--accent)}
.pcard.dim{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.8rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:.35rem;vertical-align:-1px;border:1.5px solid var(--line)}
.qa-fab{position:fixed;inset-inline-end:1rem;bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);z-index:35;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.qa-msg{padding:.6rem .8rem;border-radius:10px;max-width:92%;font-size:.92rem}
.qa-text{white-space:pre-wrap}
.qa-user{background:var(--accent);color:var(--surface);margin-inline-start:auto}
.qa-bot{background:var(--surface-2);border:1px solid var(--line)}
.student-card{display:grid;grid-template-columns:1fr auto;gap:1rem 2rem;align-items:center;border-inline-start:3px solid var(--accent);border-radius:10px}
.sc-facts{display:flex;flex-wrap:wrap;gap:.35rem 1.6rem;margin-top:.6rem}
.sc-facts div{font-size:.88rem}.sc-facts span{color:var(--muted);margin-inline-end:.3rem}
.sc-gpa{text-align:end}
.sc-gpa .v{font-family:"Source Serif 4",Georgia,serif;font-size:2.6rem;font-weight:600;line-height:1}
@media (max-width:640px){.student-card{grid-template-columns:1fr}.sc-gpa{text-align:start}}
.uni-chip{display:none}@media (min-width:640px){.uni-chip{display:inline}}
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center}
.metric .v .badge{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:.8rem}
.metric{border-bottom:1px solid var(--line)}
.req-row{display:grid;grid-template-columns:1fr auto;gap:.3rem .8rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line)}
.req-row:last-child{border-bottom:0}
.minibar{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.minibar>span{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
#print-sheet{display:none}
/* ---- Phones: compact header, step bar showing only the current step's label, smaller student card ---- */
@media (max-width:640px){
  .topbar .btn-sm{padding:.3rem .55rem;font-size:.78rem}
  .topbar .chip{font-size:.72rem;padding:.15rem .45rem}
  #hdr-email{display:none}
  #brand{font-size:1rem!important}
  .uni-logo{height:32px}
  .stepper{gap:.15rem}
  .step{flex:0 0 auto;padding:.5rem .55rem}
  .step:not(.active) .num + span{display:none}
  .step.active{flex:1 0 auto}
  .student-card{gap:.4rem;padding:1rem!important}
  .student-card h2{font-size:1.1rem}
  .sc-facts{gap:.2rem 1rem;margin-top:.35rem}
  .sc-gpa{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .7rem}
  .sc-gpa .v{font-size:1.9rem}
  .sc-gpa .mt-1,.sc-gpa .mt-2{margin-top:0}
  .metric{padding:.75rem .85rem}
  .metric .v{font-size:1.35rem}
  h2{font-size:1.2rem}
  .panel-pad{padding:1rem}
}
@media print{
  body{background:#fff;color:#000}
  body>*:not(#print-sheet){display:none!important}
  #print-sheet{display:block!important;padding:24px;font-family:"IBM Plex Sans",Arial,sans-serif;color:#000}
  #print-sheet table{width:100%;border-collapse:collapse;font-size:12px}
  #print-sheet th,#print-sheet td{border:1px solid #999;padding:6px;text-align:start}
}
</style>
</head>
<body>

<!-- =================== AUTH SCREEN =================== -->
<section id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="flex justify-end mb-2"><button class="btn btn-ghost btn-sm" id="btn-lang-auth" type="button" lang="ar"></button></div>
    <div class="mb-6">
      <h1 id="auth-title"></h1>
      <p class="muted mt-2" id="auth-sub"></p>
    </div>
    <div class="panel panel-pad" id="login-card">
      <div class="tabs mb-5" role="tablist">
        <button class="tab on" id="tab-signin" role="tab" aria-selected="true"></button>
        <button class="tab" id="tab-signup" role="tab" aria-selected="false"></button>
      </div>
      <form id="login-form" class="space-y-4" novalidate>
        <div class="field"><span class="block small font-medium mb-1" id="l-role"></span>
          <div class="flex gap-2 flex-wrap" role="radiogroup">
            <label class="chip-btn on" id="role-student-l"><input type="radio" name="role" value="student" checked class="sr-only"><span id="l-role-student"></span></label>
            <label class="chip-btn" id="role-advisor-l"><input type="radio" name="role" value="advisor" class="sr-only"><span id="l-role-advisor"></span></label>
            <label class="chip-btn" id="role-admin-l"><input type="radio" name="role" value="admin" class="sr-only"><span id="l-role-admin"></span></label>
          </div></div>
        <div class="field"><label for="f-email" id="l-email"></label><input class="input" id="f-email" type="email" autocomplete="email" placeholder="name@example.com"></div>
        <div class="field"><label for="f-sid" id="l-sid"></label><input class="input" id="f-sid" inputmode="numeric" autocomplete="username" maxlength="14" placeholder="14-digit ID"></div>
        <div class="field"><label for="f-pass" id="l-pass"></label><div class="password-field"><input class="input" id="f-pass" type="password" autocomplete="current-password"><button class="password-toggle" type="button" data-password-toggle="f-pass" aria-controls="f-pass" aria-label="Show password" aria-pressed="false" title="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.7"></circle><path class="password-eye-slash" d="M3 3l18 18"></path></svg></button></div></div>
        <div class="field hidden" id="admincode-wrap"><label for="f-admincode" id="l-admincode"></label><div class="password-field"><input class="input" id="f-admincode" type="password" autocomplete="off"><button class="password-toggle" type="button" data-password-toggle="f-admincode" aria-controls="f-admincode" aria-label="Show password" aria-pressed="false" title="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.7"></circle><path class="password-eye-slash" d="M3 3l18 18"></path></svg></button></div><p class="small muted mt-1" id="admincode-hint"></p></div>
        <div class="field hidden" id="confirm-wrap"><label for="f-pass2" id="l-pass2"></label><div class="password-field"><input class="input" id="f-pass2" type="password" autocomplete="new-password"><button class="password-toggle" type="button" data-password-toggle="f-pass2" aria-controls="f-pass2" aria-label="Show password" aria-pressed="false" title="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.7"></circle><path class="password-eye-slash" d="M3 3l18 18"></path></svg></button></div></div>
        <p id="login-err" class="small" style="color:var(--rose)" role="alert"></p>
        <button class="btn btn-primary w-full" type="submit" id="btn-login"></button>
        <div id="forgot-wrap" class="text-center small"><button class="btn btn-ghost btn-sm" type="button" id="btn-forgot"></button></div>
      </form>
    </div>
    <div class="panel panel-pad hidden" id="otp-card">
      <h2 id="otp-title"></h2>
      <p class="muted small mt-1" id="otp-sub"></p>
      <form id="otp-form" class="mt-5 space-y-4" novalidate>
        <div class="otp" id="otp-inputs"></div>
        <p id="otp-err" class="small text-center" style="color:var(--rose)" role="alert"></p>
        <button class="btn btn-primary w-full" type="submit" id="btn-verify"></button>
        <div class="flex justify-between small">
          <button type="button" class="btn btn-ghost btn-sm" id="btn-back"></button>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-resend"></button>
        </div>
      </form>
    </div>
    <!-- Real email-code recovery; code verification and new password happen on the server. -->
    <div class="panel panel-pad hidden" id="recovery-card">
      <div class="flex items-center justify-between gap-3 mb-4">
        <div><h2 id="recovery-title"></h2><p id="recovery-sub" class="muted small mt-1"></p></div>
        <span class="chip" id="recovery-step-tag">1 / 3</span>
      </div>
      <form id="recovery-request" class="space-y-4" novalidate>
        <div class="field"><label id="l-recovery-email" for="recovery-email"></label><input id="recovery-email" class="input" type="email" autocomplete="email" required placeholder="name@example.com"></div>
        <button id="recovery-send" class="btn btn-primary w-full" type="submit"></button>
      </form>
      <form id="recovery-code-form" class="space-y-4 hidden" novalidate>
        <p class="small muted" id="recovery-email-hint"></p>
        <div id="recovery-inputs" class="otp" role="group" aria-label="Six-digit email code"></div>
        <button id="recovery-verify" class="btn btn-primary w-full" type="submit"></button>
        <button id="recovery-resend" class="btn btn-ghost w-full" type="button"></button>
      </form>
      <form id="recovery-password-form" class="space-y-4 hidden" novalidate>
        <div class="field"><label for="recovery-pass" id="l-recovery-pass"></label><div class="password-field"><input id="recovery-pass" class="input" type="password" autocomplete="new-password" minlength="10" required><button class="password-toggle" type="button" data-password-toggle="recovery-pass" aria-controls="recovery-pass" aria-label="Show password" aria-pressed="false" title="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.7"></circle><path class="password-eye-slash" d="M3 3l18 18"></path></svg></button></div></div>
        <div class="field"><label for="recovery-pass2" id="l-recovery-pass2"></label><div class="password-field"><input id="recovery-pass2" class="input" type="password" autocomplete="new-password" minlength="10" required><button class="password-toggle" type="button" data-password-toggle="recovery-pass2" aria-controls="recovery-pass2" aria-label="Show password" aria-pressed="false" title="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.7"></circle><path class="password-eye-slash" d="M3 3l18 18"></path></svg></button></div></div>
        <button id="recovery-complete" class="btn btn-primary w-full" type="submit"></button>
      </form>
      <p id="recovery-err" class="small mt-3" style="color:var(--rose)" role="alert"></p>
      <p id="recovery-ok" class="small mt-3" style="color:var(--emerald)" role="status"></p>
      <div class="mt-4" style="border-top:1px solid var(--line);padding-top:.65rem"><button class="btn btn-ghost btn-sm" type="button" id="btn-recovery-back"></button></div>
    </div>
    <p class="small muted mt-4" id="auth-note"></p>
    <div class="mt-8 pt-4 flex items-center gap-3" style="border-top:1px solid var(--line)">

        <span class="chip uni-chip" id="hdr-uni"></span>
      </div>
      <div class="flex items-center gap-2 flex-wrap small">
        <span class="chip" id="hdr-email"></span>
        <span class="chip" id="hdr-sid"></span>
        <span class="chip hidden" id="hdr-role"></span>
        <label for="admin-role-switch" id="admin-role-switch-label" class="small hidden" style="color:var(--navy-ink)">Switch level:</label>
        <select id="admin-role-switch" class="select hidden" style="width:auto;min-width:145px;padding:.35rem .5rem" aria-label="Switch interface level"></select>
        <button class="btn btn-sm hidden" style="background:rgba(255,255,255,.12);color:var(--navy-ink)" id="btn-ws" type="button"></button>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.12);color:var(--navy-ink)" id="btn-lang" type="button" lang="ar"></button>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.12);color:var(--navy-ink)" id="btn-guide" type="button"></button>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.12);color:var(--navy-ink)" id="btn-account-security" type="button"></button>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.12);color:var(--navy-ink)" id="btn-logout"></button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
    <div id="deadline-banner"></div>

    <!-- ADVISOR WORKSPACE (advisor accounts) -->
    <section id="advisor-ws" class="space-y-5 hidden">
      <div><h2 id="ws-title"></h2><p class="muted mt-1" id="ws-sub"></p></div>
      <div id="admin-panel" class="space-y-4 hidden"></div>
      <div class="panel panel-pad space-y-3">
        <h3 id="ws-review-title"></h3><p class="small muted" id="ws-review-sub"></p>
        <label class="dropzone block" id="dz-req"><input type="file" accept=".json,application/json" class="hidden" id="in-req"><span id="dz-req-text"></span></label>
      </div>
      <div id="adv-review"></div>
      <div class="panel panel-pad space-y-3">
        <h3 id="ws-cal-title"></h3><p class="small muted" id="ws-cal-sub"></p>
        <div class="grid md:grid-cols-5 gap-3">
          <div class="field"><label for="cal-term" id="l-cal-term"></label><input class="input" id="cal-term" placeholder="Spring 2026-2027"></div>
          <div class="field"><label for="cal-registrationStart" id="l-cal-rs"></label><input class="input" type="date" id="cal-registrationStart"></div>
          <div class="field"><label for="cal-registrationEnd" id="l-cal-re"></label><input class="input" type="date" id="cal-registrationEnd"></div>
          <div class="field"><label for="cal-addDropEnd" id="l-cal-ad"></label><input class="input" type="date" id="cal-addDropEnd"></div>
          <div class="field"><label for="cal-withdrawalEnd" id="l-cal-wd"></label><input class="input" type="date" id="cal-withdrawalEnd"></div>
        </div>
        <div class="flex items-center gap-3 flex-wrap"><button class="btn btn-primary btn-sm" id="cal-save" type="button"></button><span class="small" id="cal-msg" role="status"></span></div>
      </div>
    </section>

    <div id="student-flow" class="space-y-6">
    <section id="admin-demo-panel" class="panel panel-pad hidden" aria-label="Administrator student demonstration">
      <label class="flex gap-2 items-center" for="admin-demo-toggle"><input type="checkbox" id="admin-demo-toggle"><strong id="admin-demo-title"></strong></label>
      <p class="small muted mt-2" id="admin-demo-description"></p>
    </section>
    <section id="student-card" class="panel hidden" aria-label="Student information"></section>
    <nav class="panel p-1 stepper" id="stepper" aria-label="Progress"></nav>

    <!-- STEP 1 -->
    <section id="step-1" class="space-y-5">
      <div><h2 id="s1-title"></h2><p class="muted mt-1" id="s1-sub"></p></div>
      <div class="grid md:grid-cols-5 gap-5">
        <div class="panel panel-pad md:col-span-3 space-y-4">
          <div class="field"><label for="sel-uni" id="l-uni"></label><select class="select" id="sel-uni"></select></div>
          <div id="uni-meta" class="small muted"></div>
          <div class="flex flex-wrap gap-2">
            <button class="btn btn-ghost btn-sm" id="btn-dl-bylaw"></button>
            <button class="btn btn-ghost btn-sm" id="btn-inspect-1"></button>
          </div>
        </div>
        <div class="panel panel-pad md:col-span-2 space-y-3">
          <h3 id="s1-upload-title"></h3>
          <p class="small muted" id="s1-upload-sub"></p>
          <label class="dropzone block" id="dz-bylaw"><input type="file" accept=".json,application/json" class="hidden" id="in-bylaw"><span id="dz-bylaw-text"></span></label>
          <div id="bylaw-msg" class="small" role="status"></div>
        </div>
      </div>
      <div class="flex justify-end"><button class="btn btn-primary" data-go="2" id="s1-next"></button></div>
    </section>

    <!-- STEP 2 -->
    <section id="step-2" class="space-y-5 hidden">
      <div><h2 id="s2-title"></h2><p class="muted mt-1" id="s2-sub"></p></div>
      <div class="panel panel-pad grid md:grid-cols-2 gap-4">
        <div class="field"><label for="sel-fac" id="l-fac"></label><select class="select" id="sel-fac"></select></div>
        <div class="field"><label for="sel-dep" id="l-dep"></label><select class="select" id="sel-dep"></select></div>
      </div>
      <div class="panel panel-pad" id="rules-summary"></div>
      <div class="flex justify-between flex-wrap gap-2">
        <button class="btn btn-ghost" data-go="1" id="s2-back"></button>
        <div class="flex gap-2"><button class="btn btn-ghost" id="btn-inspect-2"></button><button class="btn btn-primary" data-go="3" id="s2-next"></button></div>
      </div>
    </section>

    <!-- STEP 3 -->
    <section id="step-3" class="space-y-5 hidden">
      <div><h2 id="s3-title"></h2><p class="muted mt-1" id="s3-sub"></p></div>
      <div class="grid md:grid-cols-3 gap-5">
        <label class="dropzone md:col-span-2 block" id="dz-tr"><input type="file" accept=".xlsx,.xls,.csv" class="hidden" id="in-tr"><div class="font-medium" id="dz-tr-title"></div><div class="small muted mt-1" id="dz-tr-sub"></div></label>
        <div class="panel panel-pad space-y-2">
          <button class="btn btn-primary w-full" id="btn-sample"></button>
          <button class="btn btn-ghost w-full btn-sm" id="btn-tpl-xlsx"></button>
          <button class="btn btn-ghost w-full btn-sm" id="btn-tpl-csv"></button>
        </div>
      </div>
      <details class="panel panel-pad small" id="tr-help"><summary class="cursor-pointer font-medium" id="tr-help-title"></summary><div class="mt-3 space-y-3" id="tr-help-body"></div></details>
      <div id="tr-msg" role="status"></div>
      <div id="tr-results" class="hidden space-y-5">
        <div class="panel grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6" id="metrics"></div>
        <div id="sis-check"></div>
        <div id="bylaw-check"></div>
        <div id="unknown-check"></div>
        <div id="risk-box"></div>
        <div class="grid lg:grid-cols-3 gap-5">
          <div class="panel panel-pad lg:col-span-1"><h3 id="req-title"></h3><div id="req-progress" class="mt-2"></div></div>
          <div class="panel panel-pad lg:col-span-2 space-y-3">
            <div class="flex flex-wrap gap-2 items-center justify-between">
              <h3 id="hist-title"></h3>
              <div class="flex gap-2 flex-wrap">
                <input class="input" style="width:200px" id="hist-search" type="search">
                <select class="select" style="width:auto" id="hist-filter"></select>
              </div>
            </div>
            <div class="tbl-wrap" style="max-height:520px;overflow:auto"><table class="tbl" id="hist-table"></table></div>
          </div>
        </div>
        <div id="whatif-box"></div>
        <div id="transfer-box"></div>
      </div>
      <div class="flex justify-between"><button class="btn btn-ghost" data-go="2" id="s3-back"></button><button class="btn btn-primary" data-go="4" id="s3-next" disabled></button></div>
    </section>

    <!-- STEP 4 -->
    <section id="step-4" class="space-y-5 hidden">
      <div><h2 id="s4-title"></h2><p class="muted mt-1" id="s4-sub"></p></div>
      <div class="panel panel-pad flex flex-wrap gap-5 items-end">
        <div class="field"><label for="sel-term" id="l-term"></label><select class="select" id="sel-term" style="width:auto"></select><div class="small muted mt-1" id="term-note" role="status"></div></div>
        <label class="flex items-center gap-2 small"><input type="checkbox" id="chk-ip" checked> <span id="l-ip"></span></label>
        <label class="flex items-center gap-2 small"><input type="checkbox" id="chk-cross"> <span id="l-cross"></span></label>
        <button class="btn btn-primary ms-auto" id="btn-auto" type="button"></button>
      </div>
      <div id="auto-plan" aria-live="polite"></div>
      <div id="improve-box"></div>
      <div class="panel">
        <div class="tabs px-3" role="tablist" id="adv-tabs"></div>
        <div id="adv-list"></div>
      </div>
      <div class="flex justify-between"><button class="btn btn-ghost" data-go="3" id="s4-back"></button><button class="btn btn-primary" data-go="5" id="s4-next"></button></div>
    </section>

    <!-- STEP 5 -->
    <section id="step-5" class="space-y-5 hidden">
      <div><h2 id="s5-title"></h2><p class="muted mt-1" id="s5-sub"></p></div>
      <div class="panel panel-pad space-y-3">
        <div class="flex flex-wrap justify-between items-baseline gap-2">
          <div><span style="font-family:'Source Serif 4',Georgia,serif;font-size:2rem;font-weight:600" id="cap-now"></span> <span class="muted" id="cap-of"></span></div>
          <label class="flex items-center gap-2 small"><input type="checkbox" id="chk-grad"> <span id="l-grad"></span></label>
        </div>
        <div class="gauge" aria-hidden="true"><div class="fill" id="cap-fill"></div><div class="minmark" id="cap-min"></div></div>
        <div class="small muted" id="cap-rule"></div>
        <div id="cap-alert" role="alert"></div>
      </div>
      <div class="panel panel-pad space-y-3">
        <div class="flex flex-wrap justify-between gap-3 items-center"><div><h3 id="ap-title"></h3><p class="small muted" id="ap-sub"></p></div>
          <div class="flex gap-2 flex-wrap"><button class="btn btn-primary btn-sm" id="btn-send-ap" type="button"></button><label class="btn btn-ghost btn-sm" tabindex="0" id="l-load-dec"><input type="file" accept=".json,application/json" class="hidden" id="in-dec"><span id="t-load-dec"></span></label></div></div>
        <div id="decision-box"></div>
      </div>
      <div class="panel panel-pad space-y-2" id="ibn-box"></div>
      <div class="grid lg:grid-cols-2 gap-5">
        <div class="panel"><div class="panel-pad pb-2"><h3 id="plan-title"></h3></div><div id="plan-list"></div></div>
        <div class="panel"><div class="panel-pad pb-2"><h3 id="pick-title"></h3><p class="small muted" id="pick-sub"></p></div><div id="pick-list"></div></div>
      </div>
      <div class="flex justify-between flex-wrap gap-2">
        <button class="btn btn-ghost" data-go="4" id="s5-back"></button>
        <div class="flex gap-2"><button class="btn btn-ghost" id="btn-csv"></button><button class="btn btn-primary" id="btn-print"></button></div>
      </div>
    </section>

  tour: [
    ['مرحبًا بك في المرشد الأكاديمي الذكي', 'تصميم د. محمد فوزي، كلية الحاسبات والذكاء الاصطناعي – جامعة بنها.\n\nيفحص هذا النظام سجلك وفق لائحة كليتك ويساعدك على التخطيط والتسجيل بشكل صحيح.\n\nقبل أن تبدأ جهّز:\n• بيان الحالة المستخرج من ابن الهيثم بصيغة Excel ‏(.xlsx)\n• اسم برنامجك\n\nيستغرق الأمر حوالي 5 دقائق. استخدم النقاط بالأسفل للانتقال لأي موضوع، ويمكنك فتح هذا الدليل في أي وقت من «طريقة الاستخدام».'],
    ['تسجيل الدخول', '1. اختر «طالب» (يختار المرشد «مرشد أكاديمي»، ويختار مسؤول النظام «مسؤول النظام» ويحتاج رمز دخول المسؤول).\n2. أدخل بريدك الإلكتروني ورقمك القومي المكوّن من 14 رقمًا وكلمة مرور (8 أحرف على الأقل). أول مرة؟ استخدم «إنشاء حساب».\n3. اضغط «متابعة» — لا يلزم رمز تحقق في هذه النسخة التجريبية.\n\nيجب أن يطابق رقمك القومي الرقم الموجود في بيان حالتك من ابن الهيثم، ولكل رقم حساب واحد فقط. تظهر آخر 4 أرقام فقط على الشاشة.\n\nنصائح:\n• بدّل بين العربية وEnglish من الزر في الأعلى.\n• بياناتك محفوظة في هذا المتصفح فقط؛ سجّل الخروج عند الانتهاء إذا كان الجهاز مشتركًا.'],
    ['الخطوة 1 · الجامعة', '1. جامعة بنها مختارة ولائحتها محمّلة بالفعل.\n2. اضغط «التالي».\n\nلا ترفع ملف لائحة (.json) إلا إذا أعطاك مرشدك الأكاديمي أو شؤون الطلاب لائحة أحدث تنطبق عليك. يختار النظام إصدار اللائحة الساري وقت التحاقك.'],
    ['الخطوة 2 · الكلية والبرنامج', '1. اختر برنامجك: علوم الحاسب، نظم المعلومات، الحسابات العلمية، الذكاء الاصطناعي، تكنولوجيا الشبكات والمحمول، أمن المعلومات واكتشاف الأدلة الجنائية الرقمية، المعلوماتية الطبية، أو المعلوماتية الطبية الذكية.\n2. اقرأ ملخص قواعدك: حدود الساعات والتقديرات والإعادة وساعات التخرج.\n3. «استعراض لائحة الكلية» يعرض كل القواعد وكل المقررات بمتطلباتها السابقة.\n\nاختر بعناية: البرنامج الخطأ يعطي إرشادًا خطأ.'],
    ['الخطوة 3 · الحصول على بيان الحالة', '1. من نظام ابن الهيثم افتح «بيان الحالة».\n2. صدّره إلى Excel ‏(.xlsx).\n3. ارفع الملف هنا كما هو دون تعديل أو تغيير أسماء الأعمدة.\n\nيحتاج النظام: Course Code وCredit Hours، وGrade أو Degree. المقرر الذي ليس له تقدير بعد يُعتبر «قيد الدراسة».\n\nتريد التجربة فقط؟ اضغط «تحميل بيان الحالة التجريبي».'],
    ['الخطوة 3 · قراءة نتائجك', 'بعد الرفع راجع من أعلى لأسفل:\n• بطاقة الطالب: معدلك وحالتك وساعاتك.\n• السطر الأخضر: النتائج مطابقة لابن الهيثم.\n• فحص اللائحة: يؤكد أن هذه اللائحة تنطبق على سنة التحاقك.\n• مقررات غير موجودة في اللائحة (إن وُجدت): اعرضها على مرشدك.\n• متابعة الإنذار: إذا كان معدلك أقل من 2.00 يوضح المعدل المطلوب في الفصل القادم.\n• متطلبات التخرج: شريط تقدم لكل متطلب.\n• سجل المقررات: ابحث أو صفِّ مقرراتك السابقة.'],
    ['الخطوة 3 · أدوات التخطيط', '• حاسبة «ماذا لو»: اختر التقديرات المتوقعة لمقرراتك الحالية لترى معدلك الجديد وحد ساعات الفصل القادم.\n• «تفكر في تغيير البرنامج؟»: تعرض شروط اللائحة والمقررات التي يُرجَّح احتسابها في البرنامج الآخر.\n\nكلاهما تقديري لمساعدتك على القرار؛ والقرار النهائي للكلية.'],
    ['الخطوة 4 · الإرشاد', '1. اختر الفصل الذي ستسجّل فيه (عادةً الفصل القادم).\n2. اترك «اعتبار المقررات الحالية ناجحة» مفعّلًا ما دمت لم تنتهِ من الفصل الحالي.\n3. اقرأ التبويبات:\n• المتاحة والموصى بها — أولوية 1: مقررات رسبت فيها ويجب إعادتها، أولوية 2: إجبارية، أولوية 3: اختيارية.\n• غير المتاحة / المحجوبة — سبب اللائحة لكل مقرر بدقة.\n• المكتملة — ما اجتزته أو تدرسه الآن.\n• خريطة التخرج — كل الفصول المتبقية وموعد تخرجك المتوقع.\n• خريطة المتطلبات — اضغط على مقرر لترى ما يحتاجه وما يفتحه.'],
    ['الخطوة 4 · «اختر لي»', '1. اضغط «اختر لي».\n2. اختر مجال الاختياري (الذكاء الاصطناعي، البيانات، الشبكات، الصحة، البرمجيات) أو «بدون تفضيل».\n3. اقرأ السبب بجانب كل مقرر. علامة ⚠ تعني أن تقديرك في متطلب سابق كان ضعيفًا: خصص وقتًا إضافيًا للمذاكرة.\n4. اضغط «قبول ومتابعة» للانتقال للتسجيل، أو «تجاهل» لتختار بنفسك.\n\nللبرامج بمصروفات فقط: «خيارات تحسين التقدير» توضح المقررات الناجح فيها التي تستحق الإعادة لرفع معدلك (حتى 4 مقررات).'],
    ['الخطوة 5 · بناء خطتك', '1. الشريط يوضح ساعاتك مقارنة بحدك المسموح (يحدده معدلك واللائحة).\n2. أضف مقررات من «المقررات المتاحة» أو احذفها من «خطتك». المقرر الذي يتجاوز حدك يُمنع مع ذكر السبب.\n3. فعّل «استثناء فصل التخرج» فقط إذا وافق عليه مرشدك.\n4. يظهر تنبيه إذا كانت ساعاتك أقل من الحد الأدنى للفصل النظامي.'],
    ['الخطوة 5 · اعتماد المرشد', '1. اضغط «إرسال للاعتماد (.json)» وأرسل الملف الذي يتم تنزيله لمرشدك الأكاديمي (بالبريد أو Teams).\n2. يراجعه المرشد — وتُعاد فحص كل قواعد اللائحة تلقائيًا — ثم يرسل لك ملف القرار.\n3. اضغط «تحميل قرار المرشد» واختر الملف لترى «تم الاعتماد» أو التعديلات المطلوبة.\n\nإذا غيّرت خطتك بعد الاعتماد فلن يطابقها الاعتماد: أرسلها مرة أخرى.'],
    ['الخطوة 5 · فحص ابن الهيثم (من المستوى الثاني)', 'بعد التسجيل في ابن الهيثم:\n1. صدّر جدول التسجيل إلى Excel.\n2. اضغط «رفع ملف ابن الهيثم» في خطوة التسجيل.\n3. يقارنه النظام بإرشادك:\n• مقرر إجباري غير موجود ← إذا لم يكن متاحًا لك اترك العلامة واضغط «إرسال طلب المقررات لمرشدي».\n• مقرر مسجّل لا تسمح به اللائحة ← اعرضه على مرشدك (قد يكون خطأ بيانات).\n4. حمّل رد مرشدك لترى المقررات التي ستُضاف.\n\nطلاب المستوى الأول يسجّلهم شؤون الطلاب.'],
    ['اسأل عن اللائحة واحفظ خطتك', '• «اسأل عن اللائحة» (في الركن السفلي): اسأل عن أي قاعدة بالعربية أو الإنجليزية، مثل «كم ساعة أقدر أسجل لو معدلي 1.8؟». افتح «كيف تم التحقق» لترى الفحوص وراء كل إجابة.\n• «تصدير ورقة الإرشاد (CSV)» أو «تنزيل ورقة للطباعة» تحفظ خطتك النهائية.\n• تابع الشريط الأزرق بالأعلى لمواعيد التسجيل والحذف والإضافة.'],
    ['تذكّر دائمًا', '• النظام يرشدك فقط؛ ووفق اللائحة (مادة 7) أنت المسؤول عن المقررات التي تسجلها، ويلزم اعتماد مرشدك الأكاديمي.\n• سجّل مقرراتك النهائية دائمًا في ابن الهيثم — هذا النظام لا يسجّلك.\n• ارفع بيان حالة جديدًا كل فصل ليكون الإرشاد محدّثًا.\n• أي شيء غير واضح؟ اسأل مرشدك الأكاديمي أو شؤون الطلاب.\n\nبالتوفيق هذا الفصل!']

let LANG = (() => { try { const v = localStorage.getItem('adv.lang'); return v === '"ar"' || v === 'ar' ? 'ar' : 'en'; } catch (e) { return 'en'; } })();
/* Localized display of bylaw data (the bylaw itself is stored in English) */
const ARW = { Excellent: 'ممتاز', 'Very Good': 'جيد جدًا', Good: 'جيد', Pass: 'مقبول', 'Conditional pass': 'مقبول مشروط', Fail: 'راسب', Weak: 'ضعيف', 'Very Weak': 'ضعيف جدًا' };
// Article references in Arabic: "Art. 9-c" → "مادة 9-ج" (the letters follow the Arabic bylaw: أ ب ج د هـ)
const ART_L = { a: 'أ', b: 'ب', c: 'ج', d: 'د', e: 'هـ', f: 'و' };
const ART_RE = /Art\.|Program course list|Program structure|Special-programs bylaw/;
const artAr = s => (LANG !== 'ar' || !ART_RE.test(String(s))) ? s : String(s)
  .replace(/Special-programs bylaw,?\s*/g, 'لائحة البرامج الخاصة، ').replace(/Program course list \(field training\)/g, 'قائمة مقررات البرنامج (التدريب الميداني)')
  .replace(/Program course list/g, 'قائمة مقررات البرنامج').replace(/Program structure \(c\)/g, 'هيكل البرنامج (ج)')
  .replace(/Art\.\s*(\d+)(?:-([a-f]))?(?:\/([a-f]))?/g, (m, n, x, y) => 'مادة ' + n + (x ? '-' + ART_L[x] : '') + (y ? '/' + ART_L[y] : '')).replace(/,\s*/g, '، ');
const gradeWord = w => LANG === 'ar' ? (ARW[w] || w) : w;
const isoAr = s => LANG === 'ar' ? '\u2066' + s + '\u2069' : s;
const semLabel = s => LANG !== 'ar' ? s : String(s || '').replace(/\bFall\b/, 'الخريف').replace(/\bSpring\b/, 'الربيع').replace(/\bSummer\b/, 'الصيفي').replace(/(\d{4}-\d{4})/, '\u2066$1\u2069');
const offerLabel = o => o === 'Both' ? t('fall') + ' & ' + t('spring') : t(String(o).toLowerCase());
const bracketLabel = l => LANG === 'ar' ? isoAr(String(l).replace(/GPA/g, 'المعدل')) : l;
const reqLabel = r => (LANG === 'ar' && I18N.ar['req_' + r.id]) ? I18N.ar['req_' + r.id] : r.label;
const noteList = R => (LANG === 'ar' && R.notesAr) ? R.notesAr : (R.notes || []);
const uniName = u => (LANG === 'ar' && u.nameLocal) ? u.nameLocal : u.name;
const facName = f => (LANG === 'ar' && f.nameAr) ? f.nameAr : f.name;
const deptName = d => (LANG === 'ar' && d.nameAr) ? d.nameAr : d.name;
const maskId = id => { const s = String(id || ''); return s.length > 4 ? '••••' + s.slice(-4) : s; };
const idTag = id => 'ID' + String(id || '').slice(-4);
function t(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  if (vars && typeof s === 'string') for (const k in vars) {
    let v = vars[k];
    if (LANG === 'ar' && typeof v === 'string') v = artAr(v);
    if (LANG === 'ar' && /[A-Za-z0-9+]/.test(String(v)) && !/[\u0600-\u06FF\u2066]/.test(String(v))) v = '\u2066' + v + '\u2069';   // bidi isolate (invisible) for Latin/number values
    s = s.split('{' + k + '}').join(v);
  }
  return s;
}

/* =====================================================================
   2. BYLAW JSON SCHEMA (extracted from the attached Arabic PDF)
   Source: Benha University, Faculty of Computers & Artificial Intelligence,
   Undergraduate credit-hour bylaw, July 2019.

   Schema (one object per university):
   {
     id, name, nameLocal, source,
     faculties: [{
       id, name,
       rules: {
         totalHours,                     // Art. 4-c / Art. 23
         registration: { regular:{min, brackets:[{minGpa,maxGpa,inclusive...,max}], newStudentMax, graduationMax, graduationMinGpa},
                         summer:{max, graduationMax}, article },
         grading: { passPercent, finalExamMinPercent, scale:[{min,symbol,points,label}], article },
         retake:  { maxGradeSymbol, maxPoints, maxPercent, failedCountedOnce, article },
         standing:{ warningBelow, honors:{minLevelGpa, maxYears, noFailures}, generalGrades:[...] },
         levels:  [{level, minHours}],   // Art. 19
         specializationMinHours,         // Art. 4-e
         training:{ passFail, credits, codes },
         requirements: [{id, label, hours, courses|pool, ...}]  // Art. 23–26
       },
       catalog: { CODE: {code, name, credits, prereqs:[CODE], minEarnedHours, group} },
       departments: [{ id, code, name, mandatory:[CODE], electives:[CODE], plan:{fall:[], spring:[]} }]
     }]
   }
   Codes are normalised to upper case; the bylaw's "x" level placeholder
   (e.g. CSx51 = course offered at level 3 or 4) is kept as a literal X.
   ===================================================================== */

/* =====================================================================
   2b. SPECIAL (PAID) PROGRAMS – each carries its OWN rules and catalog.
   A department object may hold `rules` + `catalog`; when it is selected,
   fac() returns an "effective faculty" built from them, so every engine
   function automatically applies that program's bylaw instead of the
   regular faculty bylaw.
   ===================================================================== */

// Grading scale of the special-programs bylaws (NMT Art. 15-a): finer steps than the regular bylaw
const SPECIAL_SCALE = [
  { min: 95, symbol: 'A+', points: 4.0, label: 'Excellent' }, { min: 90, symbol: 'A', points: 4.0, label: 'Excellent' },
  { min: 85, symbol: 'A-', points: 3.7, label: 'Excellent' }, { min: 80, symbol: 'B+', points: 3.3, label: 'Very Good' },
  { min: 75, symbol: 'B', points: 3.0, label: 'Very Good' },  { min: 70, symbol: 'B-', points: 2.7, label: 'Good' },
  { min: 65, symbol: 'C+', points: 2.3, label: 'Good' },      { min: 60, symbol: 'C', points: 2.0, label: 'Pass' },
  { min: 57, symbol: 'C-', points: 1.7, label: 'Conditional pass' }, { min: 54, symbol: 'D+', points: 1.3, label: 'Conditional pass' },
  { min: 50, symbol: 'D', points: 1.0, label: 'Conditional pass' },  { min: 0, symbol: 'F', points: 0, label: 'Fail' }
];

// Shared regulations of the special-programs bylaw (taken from the NMT bylaw, Articles 3–22)
function specialRules(o) {
  return {
    totalHours: o.totalHours, minSemesters: 8, article: o.totalArticle,
    registration: {
      article: o.regArticle, prereqArticle: o.regArticle.replace('-c', '-e'),
      regular: { min: 9, minWaiver: 'Allowed only if fewer than 9 hours remain to graduate',
        brackets: [ { label: 'GPA ≥ 2.00', minGpa: 2, max: 18 }, { label: '1.00 < GPA < 2.00', minGpa: 1.0000001, max: 15 }, { label: 'GPA ≤ 1.00', minGpa: -1, max: 12 } ],
        newStudentMax: 18, graduationMax: 21, graduationMinGpa: 2 },
      summer: { max: 6, graduationMax: 9 }
    },
    grading: { article: o.gradeArticle, passPercent: 50, finalExamMinPercent: 30, maxMark: 100, scale: SPECIAL_SCALE,
      gpaFormula: 'CGPA = Σ(points × credits) / Σ credits registered; a passed retake replaces the failed grade, and for an improved course the higher grade counts' },
    retake: { article: o.retakeArticle, maxGradeSymbol: 'B+', maxPoints: 3.3, maxPercent: null, failedCountedOnce: true,
      electiveSubstitution: 'The bylaw requires retaking the same course (full attendance and all assessments)' },
    improvement: { article: o.improveArticle, bestCounts: true, maxCourses: 4,
      note: 'A passed course may be retaken once to raise its grade (at most 4 courses, more when leaving academic warning or completing graduation requirements); the higher grade counts and earned hours do not change' },
    standing: { article: o.standingArticle, warningBelow: 2.0,
      dismissal: 'CGPA below 2.00 in four consecutive regular semesters, not graduating within the 8-year maximum, or absence for more than two consecutive (or three non-consecutive) regular semesters',
      honors: null,
      generalGrades: [ { min: 3.7, label: 'Excellent' }, { min: 3.0, label: 'Very Good' }, { min: 2.3, label: 'Good' }, { min: 2.0, label: 'Pass' }, { min: 1.0, label: 'Weak' }, { min: 0, label: 'Very Weak' } ] },
    levels: { article: o.levelArticle, thresholds: [ { level: 1, minHours: 0 }, { level: 2, minHours: 28 }, { level: 3, minHours: 62 }, { level: 4, minHours: 98 } ] },
    specializationMinHours: 0,
    attendance: { article: o.attendArticle, minPercent: 75 },
    crossProgramElectiveMax: 0,
    training: { article: o.trainArticle, credits: 4, passFail: true, inGpa: false },
    requirements: o.requirements,
    notes: o.notes
  };
}
function buildCatalog(list, extras) {
  const cat = {};
  for (const [code, name, credits, pre, group] of list) cat[code] = { code, name, credits, prereqs: pre ? pre.split(' ') : [], minEarnedHours: 0, group };
  for (const code in (extras || {})) Object.assign(cat[code], extras[code]);
  return cat;
}

/* ENGINE-START */
/* =====================================================================
   4. TRANSCRIPT PARSER (.xlsx / .csv)
   Works on an "array of arrays" (rows × cells) produced by SheetJS.
   Two layouts are recognised:
   (a) Ibn Al-Haytham export: semester names appear (in order) inside a
       long text cell ("Academic Semester Fall 2023-2024 …"); each course
       table starts with a header row whose first cell is "Course Code"
       and ends with a "Term GPA" summary row. The k-th table belongs to
       the k-th semester. Columns are located by header name.
   (b) Template CSV/XLSX: a single header row containing a "Semester"
       column plus Course Code, Course Name, Credit Hours, Degree, Grade.
   ===================================================================== */
const SEM_RE = /Academic Semester\s+(Fall|Spring|Summer)\s+(\d{4}\s*-\s*\d{4})/gi;
const CODE_RE = /^[A-Za-z]{2,3}[xX0-9]{3}[A-Za-z]{0,3}$/;
const TERM_ORDER = { Fall: 0, Spring: 1, Summer: 2 };

function cellStr(v) { return v == null ? '' : String(v).trim(); }
function headerIndex(row) {
  const idx = {};
  row.forEach((c, i) => {
    const h = cellStr(c).toLowerCase();
    if (h === 'course code' || h === 'code') idx.code = i;
    else if (h === 'course name' || h === 'name') idx.name = i;
    else if (h === 'credit hours' || h === 'credits' || h === 'hours') idx.credits = i;
    else if (h === 'degree' || h === 'mark' || h === 'percentage') idx.degree = i;
    else if (h === 'grade' || h === 'letter grade') idx.grade = i;
    else if (h === 'points' || h === 'grade points') idx.points = i;
    else if (h === 'semester' || h === 'term') idx.semester = i;
    else if (h === 'course type') idx.type = i;
    else if (h === 'maximum degree') idx.max = i;
  });
  return idx;
}
function parseSemesterLabel(s) {
  const m = /(Fall|Spring|Summer)\s*(\d{4})\s*-\s*(\d{4})/i.exec(s || '');
  if (!m) return null;
  const term = m[1][0].toUpperCase() + m[1].slice(1).toLowerCase();
  return { term, year: m[2] + '-' + m[3], label: term + ' ' + m[2] + '-' + m[3], order: parseInt(m[2]) * 10 + TERM_ORDER[term] };
}

function parseTranscriptAOA(aoa) {
  const rows = aoa.map(r => (r || []).map(cellStr));
  const result = { student: {}, attempts: [], semesters: [], sis: null, layout: null };

  // Student header fields (key : value rows)
  for (const r of rows) {
    const k = (r[0] || '').toLowerCase(), v = (r[1] || '').replace(/^\s*:\s*/, '').trim();
    if (k.startsWith('program') && v) result.student.program = v;
    if (k.startsWith('level') && v) result.student.level = v;
    if (k.startsWith('students number') && v) result.student.number = v;
    if (k.startsWith('student name') && v) result.student.name = v;
    if (k.startsWith('id number') && v) result.student.nationalId = v;
    if (k.startsWith('enroll year') && v) result.student.enrollYear = v;
    if (k.startsWith('last status') && v) result.student.status = v;
    // SIS final summary: "GPA :2.52", "Earned Hours:102", "Remaining Hours:38.0"
    const joined = r.join(' ');
    const g = /(?:^|\s)GPA\s*:\s*([\d.]+)/.exec(joined), e = /Earned Hours\s*:\s*([\d.]+)/.exec(joined), rm = /Remaining Hours\s*:\s*([\d.]+)/.exec(joined);
    if (g && e && !/Term GPA/.test(joined)) result.sis = { gpa: +g[1], earned: +e[1], remaining: rm ? +rm[1] : null };
  }

  // Layout (b): template with a Semester column
  const tplHeader = rows.findIndex(r => { const h = headerIndex(r); return h.semester != null && h.code != null; });
  if (tplHeader >= 0) {
    result.layout = 'template';
    const h = headerIndex(rows[tplHeader]);
    for (let i = tplHeader + 1; i < rows.length; i++) {
      const r = rows[i]; const code = r[h.code];
      if (!code || !CODE_RE.test(code.replace(/\s/g, ''))) continue;
      const sem = parseSemesterLabel(r[h.semester]);
      if (!sem) throw new Error('Row ' + (i + 1) + ': semester “' + r[h.semester] + '” must look like “Fall 2024-2025”.');
      result.attempts.push(makeAttempt(r, h, sem));
    }
  } else {
    // Layout (a): Ibn Al-Haytham export
    result.layout = 'ibn-alhaytham';
    let semList = [];
    for (const r of rows) for (const c of r) {
      if (!c.includes('Academic Semester')) continue;
      const found = []; let m; SEM_RE.lastIndex = 0;
      while ((m = SEM_RE.exec(c))) found.push(m[1] + ' ' + m[2].replace(/\s/g, ''));
      for (const f of found) if (!semList.includes(f)) semList.push(f);
    }
    let block = -1, h = null;
    for (const r of rows) {
      if ((r[0] || '').toLowerCase() === 'course code') { block++; h = headerIndex(r); continue; }
      if (!h || !CODE_RE.test((r[0] || '').replace(/\s/g, ''))) continue;
      const sem = parseSemesterLabel(semList[block]) || { term: 'Block', year: '', label: 'Block ' + (block + 1), order: block };
      result.attempts.push(makeAttempt(r, h, sem));
    }
    if (block >= 0 && semList.length && semList.length !== block + 1)
      result.warning = 'Found ' + (block + 1) + ' course tables but ' + semList.length + ' semester names; semesters were matched in order.';
  }
  if (!result.attempts.length) throw new Error('No course rows were found. Check that the file has a “Course Code” header row.');
  const seen = new Map();
  result.attempts.forEach(a => seen.set(a.semester.label, a.semester));
  result.semesters = [...seen.values()].sort((a, b) => a.order - b.order);
  return result;
}

function makeAttempt(r, h, sem) {
  const num = v => { const x = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(x) ? null : x; };
  return {
    semester: sem, code: norm(r[h.code]), rawCode: r[h.code], name: h.name != null ? r[h.name] : '',
    credits: num(r[h.credits]) ?? 0, degree: h.degree != null ? num(r[h.degree]) : null,
    grade: h.grade != null ? cellStr(r[h.grade]) : '', points: h.points != null ? num(r[h.points]) : null,
    type: h.type != null ? r[h.type] : ''
  };
}

/* =====================================================================
   5. GPA & STANDING ENGINE
   - Grade symbol → points via the bylaw scale (Art. 15-a). If the symbol
     is missing, the percentage mark is converted using the same scale.
   - Fr / F / Abs = fail (0 points). P = pass/fail course (no GPA).
     W = withdrawn (no GPA). A blank grade with no mark = in progress.
   - Retake rule (Art. 16-a): a pass after an earlier fail is capped at D+ (2.2).
   - Each course is counted ONCE in the CGPA at its latest graded attempt
     (Art. 16-b), so a failure that was later passed no longer weighs on it.
   ===================================================================== */
function resolveCatalogCode(code, catalog) {
  if (catalog[code]) return code;
  for (const k in catalog) if ((catalog[k].aliases || []).includes(code)) return k;
  return code;
}
function gradeFromPercent(p, scale) { return scale.find(s => p >= s.min); }

function classifyAttempt(a, rules, catalog) {
  const scale = rules.grading.scale;
  const g = a.grade.toUpperCase().replace(/\s/g, '');
  const cat = catalog[resolveCatalogCode(a.code, catalog)];
  const passFail = (cat && cat.passFail) || /^[A-Z]?TR\d/.test(a.code);
  if (passFail) {
    if (g === 'P' || g === 'PASS' || (a.degree != null && a.degree >= rules.grading.passPercent)) return { kind: 'pf-pass' };
    if (!g && a.degree == null) return { kind: 'ip' };
    return { kind: 'pf-fail' };
  }
  if (['W', 'WD', 'WITHDRAWN'].includes(g)) return { kind: 'w' };
  if (['I', 'INC', 'INCOMPLETE'].includes(g)) return { kind: 'ip' };
  if (['F', 'FR', 'FA', 'ABS', 'FAIL', 'DN'].includes(g)) return { kind: 'fail', symbol: 'F', points: 0 };
  const s = scale.find(x => x.symbol === g);
  if (s) return s.points > 0 ? { kind: 'pass', symbol: s.symbol, points: s.points } : { kind: 'fail', symbol: 'F', points: 0 };
  if (a.degree != null) {
    const p = gradeFromPercent(a.degree, scale);
    return p.points > 0 ? { kind: 'pass', symbol: p.symbol, points: p.points } : { kind: 'fail', symbol: 'F', points: 0 };
  }
  return { kind: 'ip' };
}

function analyzeTranscript(tr, faculty, department) {
  const rules = faculty.rules, catalog = faculty.catalog;
  const attempts = tr.attempts.map(a => ({ ...a, cat: resolveCatalogCode(a.code, catalog) }))
                              .sort((x, y) => x.semester.order - y.semester.order);
  const byCourse = new Map();
  for (const a of attempts) {
    const c = classifyAttempt(a, rules, catalog);
    Object.assign(a, c);
    const hist = byCourse.get(a.cat) || [];
    if (a.kind === 'pass' && hist.some(h => h.kind === 'fail')) {          // retake cap
      if (a.points > rules.retake.maxPoints) { a.points = rules.retake.maxPoints; a.symbol = rules.retake.maxGradeSymbol; a.capped = true; }
      a.retake = true;
    }
    hist.push(a); byCourse.set(a.cat, hist);
  }

  // Final state per course (latest graded attempt; in-progress tracked separately)
  const courses = {};
  for (const [code, hist] of byCourse) {
    const graded = hist.filter(h => ['pass', 'fail', 'pf-pass', 'pf-fail'].includes(h.kind));
    let last = graded[graded.length - 1];
    // Grade improvement (special programs): when a passed course is retaken, the higher grade counts
    if (rules.improvement && rules.improvement.bestCounts && last && last.kind === 'pass') {
      const passes = graded.filter(h => h.kind === 'pass');
      if (passes.length > 1) last = passes.reduce((a, b) => (b.points > a.points ? b : a));
    }
    const ip = hist.some(h => h.kind === 'ip' && (!last || h.semester.order >= last.semester.order));
    const credits = (catalog[code] && catalog[code].credits) ?? hist[0].credits;
    courses[code] = {
      code, name: (catalog[code] && catalog[code].name) || hist[0].name, credits, attempts: hist,
      passed: !!last && (last.kind === 'pass' || last.kind === 'pf-pass'),
      failedOpen: !!last && (last.kind === 'fail' || last.kind === 'pf-fail'),
      everFailed: hist.some(h => h.kind === 'fail' || h.kind === 'pf-fail'),
      inProgress: ip && !(last && (last.kind === 'pass' || last.kind === 'pf-pass')),
      final: last || null, passFail: !!(catalog[code] && catalog[code].passFail) || /^[A-Z]?TR\d/.test(code)
    };
  }

  // CGPA (Art. 15-c) – GPA courses only, each counted once at its latest graded attempt
  let qp = 0, gpaHours = 0, earned = 0;
  for (const c of Object.values(courses)) {
    if (c.passFail || !c.final) continue;
    const hrs = c.final.credits || c.credits;
    gpaHours += hrs; qp += (c.final.points || 0) * hrs;
    if (c.passed) earned += hrs;
  }
  const cgpa = gpaHours ? Math.round((qp / gpaHours) * 100) / 100 : 0;

  // Training: the SIS records parts (TR401, TR402) at 0 hours; requirement met when all recorded parts are passed and none is pending
  const trParts = Object.values(courses).filter(c => c.passFail);
  const trReq = rules.requirements.find(r => r.id === 'tr');
  const trainingDone = trReq && trReq.courses && trReq.courses.length > 1
    ? trReq.courses.every(c => courses[c] && courses[c].passed)                 // e.g. MTR200 + MTR201
    : trParts.length > 0 && trParts.every(c => c.passed) && !trParts.some(c => c.inProgress);
  const trainingIP = trParts.some(c => c.inProgress);

  // Requirement buckets (Art. 23–26)
  const req = buildRequirementProgress(rules, department, courses, catalog, trainingDone);
  const totalTowardGrad = req.reduce((s, r) => s + r.done, 0);
  const remaining = Math.max(0, rules.totalHours - totalTowardGrad);
  const ipHours = Object.values(courses).filter(c => c.inProgress && !c.passFail).reduce((s, c) => s + c.credits, 0);

  const lvl = [...rules.levels.thresholds].reverse().find(l => earned >= l.minHours).level;
  const anyFail = Object.values(courses).some(c => c.everFailed);
  const standing = cgpa < rules.standing.warningBelow ? 'warn' : (rules.standing.honors && cgpa >= rules.standing.honors.minLevelGpa && !anyFail ? 'honors' : 'good');
  const general = rules.standing.generalGrades.find(g => cgpa >= g.min).label;

  return { attempts, courses, cgpa, qp, gpaHours, earned, remaining, totalTowardGrad, ipHours, level: lvl,
           standing, general, req, trainingDone, trainingIP,
           passedCount: Object.values(courses).filter(c => c.passed).length,
           failedOpenCount: Object.values(courses).filter(c => c.failedOpen && !c.inProgress).length };
}

function departmentPools(rules, department, catalog) {
  const fixed = new Set();
  rules.requirements.forEach(r => (r.courses || []).concat(r.pool || []).forEach(c => fixed.add(c)));
  const mand = new Set(department.mandatory), elec = new Set(department.electives);
  const cross = Object.keys(catalog).filter(c => !fixed.has(c) && !mand.has(c) && !elec.has(c));
  return { fixed, mand, elec, cross: new Set(cross) };
}

function buildRequirementProgress(rules, department, courses, catalog, trainingDone) {
  const pools = departmentPools(rules, department, catalog);
  const passed = c => courses[c] && courses[c].passed;
  return rules.requirements.map(r => {
    let list = r.courses || r.pool || [];
    if (r.fromDepartment === 'mandatory') list = department.mandatory;
    let done = 0, items = [];
    if (r.id === 'tr' || (r.courses && r.courses.every(c => catalog[c] && catalog[c].passFail))) {
      done = r.courses && r.courses.length > 1
        ? r.courses.filter(c => passed(c)).reduce((s, c) => s + (catalog[c].credits || 0), 0)
        : (trainingDone ? r.hours : 0);
    } else if (r.fromDepartment === 'electives') {
      let crossDone = 0;
      for (const c of Object.keys(courses)) {
        if (!passed(c)) continue;
        if (pools.elec.has(c)) { done += courses[c].credits; items.push(c); }
        else if (pools.cross.has(c) && !pools.mand.has(c) && crossDone + courses[c].credits <= (r.crossMax ?? 0)) { crossDone += courses[c].credits; done += courses[c].credits; items.push(c); }
      }
      done = Math.min(done, r.hours);
    } else {
      for (const c of list) if (passed(c)) { done += courses[c].credits; items.push(c); }
      done = Math.min(done, r.hours);
    }
    return { ...r, done, items, list };
  });
}

/* =====================================================================
   6. PREREQUISITE VALIDATOR & ADVISING ENGINE
   For every catalog course relevant to the program:
   - completed  : passed (or in progress, shown separately)
   - eligible   : not passed, every prerequisite passed (in-progress
                  counts when "assume" is on), earned-hour thresholds met,
                  offered in the target term per the program study plan
   - blocked    : anything else, with the exact bylaw reason
   Priority: 1 = failed course needing retake, 2 = mandatory requirement,
             3 = elective. Ties break on how many later courses it unlocks.
   ===================================================================== */
function offeringFor(code, department, faculty) {
  if (department.plan.fall.includes(code) && department.plan.spring.includes(code)) return 'Both';
  if (department.plan.fall.includes(code)) return 'Fall';
  if (department.plan.spring.includes(code)) return 'Spring';
  if (!department.mandatory.includes(code)) return 'Both';   // electives & cross-program: offered per department decision
  for (const d of faculty.departments) {           // fall back to any program's study plan
    if (d.plan.fall.includes(code)) return 'Fall';
    if (d.plan.spring.includes(code)) return 'Spring';
  }
  return 'Both';                                    // electives: offered per department decision
}

function categoryOf(code, rules, department, pools) {
  for (const r of rules.requirements) {
    if ((r.courses || []).includes(code)) return r.cat;
    if ((r.pool || []).includes(code)) return r.cat;
  }
  if (pools.mand.has(code)) return 'catDep';
  if (pools.elec.has(code)) return 'catEle';
  return 'catCross';
}

function advise(analysis, faculty, department, opts) {
  const { rules, catalog } = faculty;
  const pools = departmentPools(rules, department, catalog);
  const C = analysis.courses;
  const passedOrAssumed = c => C[c] && (C[c].passed || (opts.assumeIP && C[c].inProgress));
  const earnedEff = analysis.earned + (opts.assumeIP ? analysis.ipHours : 0);
  const reqById = Object.fromEntries(analysis.req.map(r => [r.id, r]));
  const uniEMet = reqById.uniE && reqById.uniE.done >= reqById.uniE.hours;
  const depE = reqById.depE;
  const crossUsed = depE ? depE.items.filter(c => pools.cross.has(c)).reduce((s, c) => s + C[c].credits, 0) : 0;

  // How many courses each course unlocks (for tie-breaking)
  const unlockCount = {};
  for (const k in catalog) for (const p of catalog[k].prereqs) unlockCount[p] = (unlockCount[p] || 0) + 1;

  const relevant = new Set([...pools.fixed, ...pools.mand, ...pools.elec]);
  if (opts.showCross) pools.cross.forEach(c => relevant.add(c));
  Object.keys(C).forEach(c => relevant.add(c));

  const eligible = [], blocked = [], completed = [];
  for (const code of relevant) {
    const course = catalog[code];
    const st = C[code];
    if (st && (st.passed || st.inProgress)) { completed.push({ code, course, st }); continue; }
    if (!course) continue;
    if (course.passFail && !st && (analysis.trainingDone || analysis.trainingIP)) {
      const trReq = rules.requirements.find(r => r.id === 'tr');
      if (!(trReq && trReq.courses && trReq.courses.length > 1)) continue;   // single training code recorded under part codes
    }
    const cat = categoryOf(code, rules, department, pools);
    const reasons = [], keys = [];   // keys: rule categories, counted in the anonymous pilot statistics
    for (const p of course.prereqs) if (!passedOrAssumed(p)) { reasons.push(t('rMissing', { code: catalog[p]?.displayCode || p, name: catalog[p]?.name || '' })); keys.push('prerequisite'); }
    if (course.minEarnedHours && earnedEff < course.minEarnedHours) { reasons.push(t('rHours', { n: course.minEarnedHours, have: earnedEff })); keys.push('earnedHours'); }
    if (course.group === 'D' && rules.specializationMinHours && earnedEff < rules.specializationMinHours) { reasons.push(t('rSpec', { n: rules.specializationMinHours })); keys.push('specialization'); }
    const off = offeringFor(code, department, faculty);
    if (opts.term !== 'Summer' && off !== 'Both' && off !== opts.term) { reasons.push(t('rOffered', { term: t(opts.term.toLowerCase()), off: t(off.toLowerCase()) })); keys.push('notOffered'); }
    if (cat === 'catUniE' && uniEMet && !(st && st.failedOpen)) { reasons.push(t('rElectiveMet')); keys.push('electiveMet'); }
    if (cat === 'catEle' && depE && depE.done >= depE.hours && !(st && st.failedOpen)) { reasons.push(t('rElectiveMet')); keys.push('electiveMet'); }
    if (cat === 'catCross' && crossUsed + course.credits > (rules.crossProgramElectiveMax ?? 0)) { reasons.push(t('rCrossCap', { n: rules.crossProgramElectiveMax ?? 0 })); keys.push('crossCap'); }
    const priority = st && st.failedOpen ? 1 : (['catUni', 'catFac', 'catDep', 'catProj', 'catTrain'].includes(cat) ? 2 : 3);
    const item = { code, course, st, cat, off, priority, unlocks: unlockCount[code] || 0, reasons, keys };
    (reasons.length ? blocked : eligible).push(item);
  }
  // Course level from its code (Art. 22 code system): first digit after the letters; "X" = level 3 or 4 elective → 3
  const lvl = c => { const m = /^[A-Z]{1,3}?([0-9X])/.exec(c); return !m ? 9 : m[1] === 'X' ? 3 : +m[1]; };
  eligible.sort((a, b) => a.priority - b.priority || lvl(a.code) - lvl(b.code) || b.unlocks - a.unlocks || a.code.localeCompare(b.code));
  const metOnly = x => x.reasons.length === 1 && x.reasons[0] === t('rElectiveMet') ? 1 : 0;   // push "requirement already met" to the end
  blocked.sort((a, b) => metOnly(a) - metOnly(b) || a.priority - b.priority || a.reasons.length - b.reasons.length || a.code.localeCompare(b.code));
  completed.sort((a, b) => a.code.localeCompare(b.code));
  return { eligible, blocked, completed };
}

/* Credit-hour cap from GPA at the start of the semester (Art. 9-c) */
function creditCap(analysis, rules, opts) {
  const R = rules.registration, gpa = analysis.cgpa;
  if (opts.term === 'Summer') {
    const grad = opts.gradException;
    return { max: grad ? R.summer.graduationMax : R.summer.max, min: 0,
             rule: (grad ? t('crSummerGrad', { n: R.summer.graduationMax }) : t('crSummer', { n: R.summer.max })) + ' (' + R.article + ')' };
  }
  const isNew = analysis.gpaHours === 0;
  let b = R.regular.brackets.find(x => gpa >= x.minGpa);
  let max = isNew ? R.regular.newStudentMax : b.max;
  let rule = isNew ? t('crNew', { n: max }) : t('crBracket', { b: bracketLabel(b.label), g: gpa.toFixed(2), n: max });
  if (opts.gradException && gpa >= R.regular.graduationMinGpa) { max = R.regular.graduationMax; rule = t('crGrad', { g: R.regular.graduationMinGpa, n: max }); }
  const remaining = analysis.remaining - (opts.assumeIP ? analysis.ipHours : 0);
  const min = remaining < R.regular.min ? 0 : R.regular.min;
  return { max, min, rule: rule + ' (' + R.article + ')' };
}

async function sha256(s) {

}

async function apiRequest(route, body) {

      if (body.role !== 'student') {
        throw new Error('Only students can self-register. Staff members should register as students, then an authorized administrator must approve their role in Supabase.');
      }
      r = await sb.auth.signUp({
        email: body.email,
        password: body.password,
        options: { data: { sid: body.sid } }
      });
      checkSupabase(r.error);
      if (r.data && r.data.session) {
        await sb.auth.signOut();

      }
      return { ok: true };

    case '/api/auth/register/verify': {

      checkSupabase(r.error);

    }
    case '/api/auth/register/resend': {

      checkSupabase(r.error);

    case '/api/auth/login': {

      checkSupabase(r.error);

      catch (e) { await sb.auth.signOut(); throw e; }
      if (p.sid !== body.sid || (p.role !== body.role && p.role !== 'admin')) {
        await sb.auth.signOut();
        throw new Error('Email, ID or selected role does not match the account.');
      }
      // Only a database-approved admin may log into any of the three UI modes.
      if (p.role === 'admin') sessionStorage.setItem(levelPreferenceKey(r.data.user.id), body.role);
      return { user: profileForInterface(p, r.data.user.id, body.role) };
    }
    case '/api/auth/me': {
      r = await sb.auth.getUser();
      if (r.error || !r.data.user) return { user: null };
      const p = await accountProfile(r.data.user);
      const chosen = p.role === 'admin'
        ? sessionStorage.getItem(levelPreferenceKey(r.data.user.id)) || 'admin'
        : p.role;
      return { user: profileForInterface(p, r.data.user.id, chosen) };
    }
    case '/api/auth/logout': {

    case '/api/auth/recovery/start': {

      checkSupabase(r.error);

      return { resetToken: 'verified-by-supabase-session' };
    }
    case '/api/auth/recovery/complete': {

function validateBylaw(obj) {
  const list = Array.isArray(obj) ? obj : [obj];
  for (const u of list) {
    if (!u.id || !u.name) throw new Error('each university needs "id" and "name"');
    if (u.effectiveFrom && !/^\d{4}-\d{4}$/.test(u.effectiveFrom)) throw new Error('"effectiveFrom" must look like "2024-2025"');
    if (!Array.isArray(u.faculties) || !u.faculties.length) throw new Error('"faculties" must be a non-empty array');
    for (const f of u.faculties) {
      if (!f.rules || !f.rules.registration || !f.rules.grading || !Array.isArray(f.rules.requirements)) throw new Error('faculty “' + (f.name || f.id) + '” is missing rules.registration, rules.grading or rules.requirements');
      if (!f.catalog || typeof f.catalog !== 'object') throw new Error('faculty “' + (f.name || f.id) + '” has no catalog');
      if (!Array.isArray(f.departments) || !f.departments.length) throw new Error('faculty “' + (f.name || f.id) + '” has no departments');
      for (const d of f.departments) if (!d.plan || !Array.isArray(d.mandatory)) throw new Error('department “' + (d.name || d.id) + '” needs "mandatory" and "plan"');
    }
  }
  return list;
}

/* File downloads: inside claude.ai the page must hand files to the viewer through
   the "downloads" capability (the viewer confirms each save). Outside claude.ai
   (e.g. the file opened directly in a browser) a normal link download is used. */
let downloadsCap;
const downloadsReady = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('downloads').then(d => (downloadsCap = d)).catch(() => (downloadsCap = null))
  : Promise.resolve(downloadsCap = undefined);
async function download(name, content, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  await downloadsReady;
  if (downloadsCap) {
    try { await downloadsCap.save({ filename: name, data: blob }); }
    catch (e) { if (e && e.code !== 'declined') alertToast('Could not save ' + name + ': ' + (e.message || e.code)); }
    return;
  }
  if (downloadsCap === null) { alertToast('File downloads are not available in this view.'); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function readTranscriptFile(file) {

/* ---- "Select for me": automatic plan from the bylaw rules ----
   Order of selection (same priorities as the advising list):
   1. Failed courses that must be retaken (Priority 1)
   2. Required courses, lowest level first (Priority 2)
   3. Electives, only up to the hours the student still needs
   Every pick must fit the GPA-based credit cap (creditCap). Field
   training (pass/fail) is left out because it is scheduled separately. */
/* =====================================================================
   PLANNING ENGINE (shared by "Select for me", the graduation roadmap
   and the AI agent). Pure function of a record + bylaw.
   Load balancing: a course is "heavy for this student" when the student
   failed it before or passed one of its prerequisites below C; at most
   two heavy ELECTIVES are placed in one semester. Required courses are
   never dropped for balance (that could delay graduation) but are marked.
   ===================================================================== */
function heavyReasons(A, f, code) {
  const R = f.rules, cat = f.catalog, c = cat[code]; if (!c) return [];
  const cPts = (R.grading.scale.find(s => s.symbol === 'C') || { points: 2.4 }).points;
  const out = [];
  const st = A.courses[code];
  if (st && st.everFailed) out.push(t('heavyFailed'));
  for (const p of c.prereqs) {
    const s = A.courses[p];
    if (s && s.passed && s.final && s.final.kind === 'pass' && s.final.points < cPts) out.push(t('heavyPre', { code: cat[p]?.displayCode || p, g: s.final.symbol }));
  }
  return out;
}
function planFor(A, f, d, o) {
  const R = f.rules, C = A.courses;
  const adv = advise(A, f, d, { term: o.term, assumeIP: o.assumeIP, showCross: false });
  const cap = creditCap(A, R, { term: o.term, gradException: o.gradException, assumeIP: o.assumeIP });
  const req = Object.fromEntries(A.req.map(r => [r.id, r]));
  const pools = departmentPools(R, d, f.catalog);
  const ipHours = list => list.filter(c => o.assumeIP && C[c] && C[c].inProgress).reduce((s, c) => s + C[c].credits, 0);
  const need = {
    catUniE: req.uniE ? Math.max(0, req.uniE.hours - req.uniE.done - ipHours(req.uniE.pool || [])) : 0,
    catEle: req.depE ? Math.max(0, req.depE.hours - req.depE.done - ipHours(Object.keys(C).filter(c => pools.elec.has(c) || pools.cross.has(c)))) : 0
  };
  const interest = o.interest || 'any';
  const score = it => interestScore(it.course.name, interest);
  const heavy = {}; adv.eligible.forEach(e => { heavy[e.code] = heavyReasons(A, f, e.code); });
  // electives: interest match first, then lighter ones, keeping the bylaw order otherwise
  const ordered = adv.eligible.filter(e => e.priority < 3).concat(adv.eligible.filter(e => e.priority === 3).map((e, i) => [e, i])
    .sort((a, b) => score(b[0]) - score(a[0]) || (heavy[a[0].code].length ? 1 : 0) - (heavy[b[0].code].length ? 1 : 0) || a[1] - b[1]).map(x => x[0]));
  const picks = [], why = {}, warn = {}; let total = 0, skippedTraining = false, heavyCount = 0;
  for (const it of ordered) {
    const cr = it.course.credits, hv = heavy[it.code];
    if (it.course.passFail) { skippedTraining = true; continue; }
    if (total + cr > cap.max) continue;
    if (it.priority === 3) {
      const key = it.cat === 'catCross' ? 'catEle' : it.cat;
      if (it.cat === 'catCross' || !(need[key] > 0)) continue;   // program electives only, and only while still needed
      if (hv.length && heavyCount >= 2) continue;                 // balance: no third heavy elective
      why[it.code] = interest !== 'any' && score(it) > 0 ? t('whyEI', { area: t('interests')[interest], n: need[key] }) : t('whyE', { n: need[key] });
      need[key] -= cr;
    } else {
      why[it.code] = it.priority === 1 ? t('whyP1') : t('whyP2', { cat: catLabel(it.cat) });
    }
    if (hv.length) { heavyCount++; warn[it.code] = hv.join('; '); }

}
function autoSelect() {

  return { ...P, key: autoKey() };
}

/* ---- Graduation roadmap: semester-by-semester simulation until every requirement is met ----
   Assumptions (shown to the student): in-progress and planned courses are passed with a grade
   close to the current CGPA, only regular semesters are planned, offerings follow the study plan. */
function nearestPassSymbol(gpa, scale) {
  const pass = scale.filter(s => s.points > 0);
  return pass.reduce((b, s) => Math.abs(s.points - gpa) < Math.abs(b.points - gpa) ? s : b, pass[pass.length - 1]).symbol;
}
function nextTerm(term, year) {
  const y = /^(\d{4})-(\d{4})$/.exec(year || '');
  if (term === 'Fall') return { term: 'Spring', year };
  const ny = y ? (+y[1] + 1) + '-' + (+y[2] + 1) : '';
  return { term: 'Fall', year: ny };
}
function nonTrainingRemaining(A) { return A.req.filter(r => r.id !== 'tr').reduce((s, r) => s + Math.max(0, r.hours - r.done), 0); }
function buildRoadmap(interest) {
  const f = fac(), d = dept(), R = f.rules, tr = S.transcript;
  const sym = nearestPassSymbol(S.analysis.cgpa || 2, R.grading.scale);
  let attempts = tr.attempts.map(a => (!a.grade && a.degree == null) ? { ...a, grade: /^[A-Z]?TR\d/.test(norm(a.code)) ? 'P' : sym, assumed: true } : a);
  const last = tr.semesters[tr.semesters.length - 1] || { term: 'Fall', year: '' };
  let cur = last.term === 'Fall' ? { term: 'Spring', year: last.year } : { term: 'Fall', year: nextTerm('Spring', last.year).year };
  let order = Math.max(...tr.attempts.map(a => a.semester.order)) + 1;
  const semesters = []; let stuck = 0, A = null;
  for (let i = 0; i < 12; i++) {
    A = analyzeTranscript({ ...tr, attempts }, f, d);
    const left = nonTrainingRemaining(A);
    if (left <= 0) break;
    const ge = A.cgpa >= R.registration.regular.graduationMinGpa && left <= R.registration.regular.graduationMax;
    const P = planFor(A, f, d, { term: cur.term, assumeIP: false, gradException: ge, interest: interest || 'any' });
    if (!P.picks.length) { if (++stuck >= 2) break; }
    else stuck = 0;
    semesters.push({ term: cur.term, year: cur.year, picks: P.picks, why: P.why, warn: P.warn, total: P.total, cap: P.cap.max, gradException: ge });
    const sem = { term: cur.term, year: cur.year, label: cur.term + ' ' + cur.year, order: order++ };
    attempts = attempts.concat(P.picks.map(c => ({ semester: sem, code: c, rawCode: c, name: f.catalog[c].name, credits: f.catalog[c].credits, degree: null, grade: sym, points: null, type: '', planned: true })));
    cur = nextTerm(cur.term, cur.year);
  }
  A = analyzeTranscript({ ...tr, attempts }, f, d);
  const done = nonTrainingRemaining(A) <= 0;
  // single-semester required courses still ahead: missing them delays graduation by a year
  const req = new Set([...d.mandatory, ...R.requirements.filter(r => r.courses && r.id !== 'tr').flatMap(r => r.courses)]);
  const oneTerm = [...req].filter(c => !(S.analysis.courses[c] && (S.analysis.courses[c].passed || S.analysis.courses[c].inProgress)))
    .map(c => ({ c, off: offeringFor(c, d, f) })).filter(x => x.off !== 'Both');
  const blockedLeft = done ? [] : advise(A, f, d, { term: cur.term, assumeIP: false }).blocked.filter(b => b.priority < 3).slice(0, 6);
  return { semesters, done, assumedGrade: sym, trainingLeft: !A.trainingDone, oneTerm, blockedLeft,
    graduation: done && semesters.length ? semesters[semesters.length - 1] : null };
}

/* ---- Transcript check: courses that are not in the selected program's bylaw ---- */
function unknownCourses(A, f) {
  const seen = new Map();
  for (const a of A.attempts) if (!f.catalog[a.cat] && !/^[A-Z]?TR\d/.test(a.cat) && !seen.has(a.cat)) seen.set(a.cat, a);
  return [...seen.values()];
}

/* ---- CGPA history and academic-warning / dismissal tracker ---- */
function gpaHistory() {
  const tr = S.transcript, f = fac(), d = dept(), out = [];
  for (const s of tr.semesters) {
    const graded = tr.attempts.some(a => a.semester.order === s.order && (a.grade || a.degree != null));
    if (!graded) continue;
    const A = analyzeTranscript({ ...tr, attempts: tr.attempts.filter(a => a.semester.order <= s.order) }, f, d);
    out.push({ label: s.label, term: s.term, cgpa: A.cgpa, regular: s.term !== 'Summer' });
  }
  return out;
}
function warningStatus() {
  const R = fac().rules, A = S.analysis, H = gpaHistory();
  let run = 0;
  for (let i = H.length - 1; i >= 0; i--) { if (!H[i].regular) continue; if (H[i].cgpa < R.standing.warningBelow) run++; else break; }
  const limit = 4;                                                       // four consecutive regular semesters (dismissal rule)
  const need = h => { const q = R.standing.warningBelow * (A.gpaHours + h) - A.qp; return q <= 0 ? 0 : q / h; };
  const cap = creditCap(A, R, { term: S.term, gradException: false, assumeIP: false }).max;
  return { history: H, run, limit, below: A.cgpa < R.standing.warningBelow, needAtCap: need(cap), cap, need12: need(12), article: R.standing.article };
