/* ---- Bylaw version / cohort check (bylaws are renewed about every 5 years) ---- */
function startYear(y) { const m = /(\d{4})/.exec(y || ''); return m ? +m[1] : null; }
function bylawCohortCheck() {
  const u = uni(), d = dept();
  const eff = (d && d.effectiveFrom) || u.effectiveFrom, issued = (d && d.issuedYear) || u.issuedYear, renew = u.renewalYears || 5;
  const effY = startYear(eff), enroll = S.transcript && startYear(S.transcript.student.enrollYear);
  const now = new Date().getFullYear(), age = issued ? now - issued : null;
  let status = 'unknown';
  if (enroll && effY) status = enroll < effY ? 'older' : enroll >= effY + renew ? 'newer' : 'applies';
  else if (age != null && age >= renew) status = 'aged';
  return { eff, issued, renew, enroll, enrollLabel: S.transcript ? S.transcript.student.enrollYear : '', age, status, versions: UNIVERSITIES.filter(x => x.family && x.family === u.family) };
}
/* If several versions of the same bylaw are loaded, pick the one in force when the student enrolled */
function autoPickBylawVersion() {
  const u = uni(), enroll = S.transcript && startYear(S.transcript.student.enrollYear);
  if (!u.family || !enroll) return null;
  const cands = UNIVERSITIES.filter(x => x.family === u.family && startYear(x.effectiveFrom) && startYear(x.effectiveFrom) <= enroll)
    .sort((a, b) => startYear(b.effectiveFrom) - startYear(a.effectiveFrom));
  const best = cands[0];

/* ---- Program transfer check ---- */
function normCourseName(s) {
  return String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\b(introduction to|intro to|fundamentals of|basics of|basic of|principles of)\b/g, ' ').replace(/\s+/g, ' ').trim();
}
function nameMatch(a, b) {
  const x = normCourseName(a), y = normCourseName(b); if (!x || !y) return false; if (x === y) return true;
  const sa = new Set(x.split(' ').filter(w => w.length > 2 && w !== 'and')), sb = new Set(y.split(' ').filter(w => w.length > 2 && w !== 'and'));
  const inter = [...sa].filter(w => sb.has(w)).length, uni2 = new Set([...sa, ...sb]).size;
  return uni2 > 0 && inter / uni2 >= 0.75 && inter >= 2;
}
function transferCheck(targetId) {
  const F = rawFac(), from = dept(), to = F.departments.find(x => x.id === targetId);
  if (!from || !to || from.id === to.id) return null;
  const A = S.analysis, W = warningStatus();
  const fromSpecial = !!from.rules, toSpecial = !!to.rules;
  const target = to.rules ? { rules: to.rules, catalog: to.catalog } : { rules: F.rules, catalog: F.catalog };
  const checks = [];
  if (fromSpecial && !toSpecial) {                                       // special-programs bylaw Art. 20-a/b
    const pct = Math.round(A.earned / fac().rules.totalHours * 100);
    const regSem = new Set(S.transcript.attempts.filter(a => a.semester.term !== 'Summer' && (a.grade || a.degree != null)).map(a => a.semester.label)).size;
    const anyFail = Object.values(A.courses).some(c => c.everFailed);
    checks.push({ ok: pct < 60, text: t('trf60', { pct }) }, { ok: regSem >= 2, text: t('trfTwoSem', { n: regSem }) },
      { ok: !anyFail, text: t('trfAllPassed') }, { ok: null, text: t('trfAdmission') });
  } else if (!fromSpecial && toSpecial) {                                // Art. 20-d/e
    checks.push({ ok: W.run < 3, text: t('trfNotDismissal', { run: W.run }) }, { ok: null, text: t('trfNotDismissed') }, { ok: null, text: t('trfFees') });
  } else if (!fromSpecial && !toSpecial) {                               // regular programs: Art. 4-d/e
    checks.push({ ok: null, text: t('trfRegular', { h: F.rules.specializationMinHours }) });
  } else {
    checks.push({ ok: null, text: t('trfSpecialSpecial') });
  }
  const tcat = Object.values(target.catalog), seenT = new Set(), mapped = [], lost = [];
  for (const c of Object.values(A.courses)) {
    if (!c.passed || c.passFail) continue;
    const m = tcat.find(x => !seenT.has(x.code) && (nameMatch(x.name, c.name) || norm(x.code) === norm(c.code)));
    if (m) { seenT.add(m.code); mapped.push({ from: c, to: m }); } else lost.push(c);
  }
  let credited = mapped.reduce((s, x) => s + Math.min(x.from.credits, x.to.credits), 0), exact = false;
  if (!fromSpecial && !toSpecial) {                                      // same faculty bylaw: compute exactly against the target program's requirements
    const A2 = analyzeTranscript(S.transcript, F, to); credited = A2.totalTowardGrad; exact = true;
  }
  return { from, to, checks, mapped, lost, credited, exact, targetTotal: target.rules.totalHours, article: (fromSpecial || toSpecial) ? 'Special-programs bylaw, Art. 20' : 'Art. 4-d/e' };
}

/* ---- Advisor approval workflow (file-based, works on any server) ----
   The student downloads an approval request (.json) with the plan and the course records needed to
   re-check it. The advisor loads it in advisor mode: the system RE-RUNS every bylaw check, then the
   advisor approves or asks for changes and downloads a decision file that the student loads back.
   The fingerprint ties a decision to one exact plan. */
async function planFingerprint(o) { return (await sha256(JSON.stringify([o.studentId, o.term, [...o.plan].sort(), o.program, o.university]))).slice(0, 16); }
async function buildRequest() {
  const st = S.transcript.student || {};
  const body = { type: 'ai-academic-advisor/request', version: 1, created: new Date().toISOString(),
    university: S.uniId, faculty: S.facId, program: S.depId, term: S.term, gradException: S.gradException, assumeIP: S.assumeIP,
    studentId: activeStudentId(), email: S.session.email, demo: isStudentDemo(), studentNumber: st.number || '', studentName: st.name || '', enrollYear: st.enrollYear || '',
    plan: S.plan.slice(), attempts: S.transcript.attempts.map(a => [a.semester.label, a.rawCode, a.name, a.credits, a.degree, a.grade]) };
  body.fingerprint = await planFingerprint(body);
  return body;
}
function requestToState(r) {
  const u = UNIVERSITIES.find(x => x.id === r.university); if (!u) throw new Error(t('advNoUni', { u: r.university }));
  const F = u.faculties.find(x => x.id === r.faculty) || u.faculties[0];
  const d = F.departments.find(x => x.id === r.program); if (!d) throw new Error(t('advNoProg', { p: r.program }));
  const f = d.rules ? { ...F, rules: d.rules, catalog: d.catalog, departments: [d], ownBylaw: d.bylawName } : F;
  const tpl = [['Semester', 'Course Code', 'Course Name', 'Credit Hours', 'Degree', 'Grade'], ...r.attempts];
  const tr = parseTranscriptAOA(tpl);
  const A = analyzeTranscript(tr, f, d);
  const adv = advise(A, f, d, { term: r.term, assumeIP: r.assumeIP !== false, showCross: true });
  const cap = creditCap(A, f.rules, { term: r.term, gradException: !!r.gradException, assumeIP: r.assumeIP !== false });
  const rows = r.plan.map(code => {
    const e = adv.eligible.find(x => x.code === code), b = adv.blocked.find(x => x.code === code), c = f.catalog[code];
    return { code, name: c ? c.name : code, credits: c ? c.credits : 0, ok: !!e, reasons: e ? [] : b ? b.reasons : [t('advNotEligible')], cat: (e || b) ? catLabel((e || b).cat) : '' };
  });
  const total = rows.reduce((s, x) => s + x.credits, 0);
  return { u, f, d, A, cap, rows, total, overCap: total > cap.max, underMin: cap.min && total < cap.min };
}

   IBN AL-HAYTHAM REGISTRATION CHECK (students from level 2; level 1 is
   registered by student affairs).
   The student uploads the timetable / course list exported from Ibn
   Al-Haytham (the "StudentsData.xls" export is an HTML table). Only the
   semester and course codes are read; names and IDs in the file are ignored.
   The advice for that semester is rebuilt from the record BEFORE this
   registration, then compared:
   - required courses advised but not registered  → course request to the advisor
   - registered courses the bylaw says are not eligible → flagged (likely data error)
   - elective hours and the credit-hour limit are checked
   ===================================================================== */
const IBN_TERM_AR = { 'الأول': 'Fall', 'الاول': 'Fall', 'الثاني': 'Spring', 'الثانى': 'Spring', 'الصيفي': 'Summer', 'الصيفى': 'Summer' };
function htmlToText(s) {
  return String(s).replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' | ')
    .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&#(\d+);/g, (m, n) => String.fromCharCode(+n)).replace(/\s+/g, ' ');
}
function parseIbnRegistration(text) {
  const cat = fac().catalog, out = { term: null, year: null, codes: [], unknown: [], kind: /الجدول الدراسي/.test(text) ? 'schedule' : 'list' };
  const y = /(\d{4})\s*-\s*(\d{4})/.exec(text); if (y) out.year = y[1] + '-' + y[2];
  const en = /\b(Fall|Spring|Summer)\b/i.exec(text);
  if (en) out.term = en[1][0].toUpperCase() + en[1].slice(1).toLowerCase();
  else for (const k in IBN_TERM_AR) if (text.includes(k)) { out.term = IBN_TERM_AR[k]; break; }
  const seen = new Set();
  const re = /(?<![A-Za-z])([A-Za-z]{2,4}\s?[xX0-9]\d{2})(?![0-9])/g; let m;
  while ((m = re.exec(text))) {
    const raw = m[1].replace(/\s/g, ''), code = resolveCatalogCode(norm(raw), cat);
    if (seen.has(code)) continue; seen.add(code);
    if (cat[code]) out.codes.push(code); else if (!/^(?:AM|PM)\d/i.test(raw)) out.unknown.push(raw);
  }
  return out;
}
async function readIbnFile(file) {
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    let text;
    const head = new TextDecoder('utf-8').decode(buf.slice(0, 200)).trim();
    if (head.startsWith('<') || /\.(html?|txt|csv)$/i.test(file.name)) text = htmlToText(new TextDecoder('utf-8').decode(buf));
    else { if (!window.XLSX) throw new Error('Excel reader unavailable. Refresh the page and try again.'); const wb = XLSX.read(buf, { type: 'array' }); text = wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' }).map(r => r.join(' | ')).join(' \n ')).join(' \n '); }
    const P = parseIbnRegistration(text);
    if (!P.codes.length) throw new Error(t('ibnNoCodes'));
    S.ibn = { ...P, fileName: file.name }; S.ibnMissChecked = null; S.courseDecision = null;
    logUsage('ibnFilesChecked');
  } catch (e) { S.ibn = { error: e.message || String(e) }; }
  renderIbnBox();
}

/* Evidence for one course: every bylaw check, with the article, written so the advisor need not open the bylaw */
function courseEvidence(code, ctx) {
  const { A, f, d, term, assumeIP, adv, cap, planTotal } = ctx, cat = f.catalog, c = cat[code], R = f.rules, C = A.courses;
  const e = adv.eligible.find(x => x.code === code), b = adv.blocked.find(x => x.code === code);
  const preArt = R.registration.prereqArticle || R.registration.article;
  const earnedEff = A.earned + (assumeIP ? A.ipHours : 0);
  const checks = [];
  checks.push({ ok: !(C[code] && C[code].passed), text: C[code] && C[code].passed ? t('evPassed') : t('evNotPassed') });
  if (c.prereqs.length) for (const p of c.prereqs) {
    const s = C[p], ok = !!(s && (s.passed || (assumeIP && s.inProgress)));
    checks.push({ ok, art: preArt, text: t('evPre', { code: cat[p]?.displayCode || p, name: cat[p]?.name || '', st: s && s.passed ? t('evPreGrade', { g: s.final.symbol }) : s && s.inProgress ? t('evPreIP') : t('evPreNo') }) });
  } else checks.push({ ok: true, art: preArt, text: t('evNoPre') });
  if (c.minEarnedHours) checks.push({ ok: earnedEff >= c.minEarnedHours, art: R.article, text: t('evHours', { n: c.minEarnedHours, have: earnedEff }) });
  if (c.group === 'D' && R.specializationMinHours) checks.push({ ok: earnedEff >= R.specializationMinHours, art: 'Art. 4-e', text: t('evSpec', { n: R.specializationMinHours, have: earnedEff }) });
  const off = offeringFor(code, d, f);
  checks.push({ ok: term === 'Summer' || off === 'Both' || off === term, art: t('evStudyPlan'), text: t('evOffered', { term: t(term.toLowerCase()), off: offerLabel(off) }) });
  checks.push({ ok: planTotal <= cap.max, art: R.registration.article, text: t('evCap', { tot: planTotal, max: cap.max, rule: cap.rule }) });
  const it = e || b, catKey = it ? it.cat : null;
  const required = ['catUni', 'catFac', 'catDep', 'catProj'].includes(catKey);
  const impact = C[code] && C[code].failedOpen ? t('evImpactRetake') : required ? (off !== 'Both' ? t('evImpactYear', { term: t(off.toLowerCase()) }) : t('evImpactReq')) : t('evImpactElective');
  return { code, display: c.displayCode || code, name: c.name, credits: c.credits, category: catKey ? catLabel(catKey) : '', eligible: !!e, required, checks, impact, reasons: b ? b.reasons : [] };
}

function ibnCompare() {
  const I = S.ibn, f = fac(), d = dept(), R = f.rules, tr = S.transcript;
  const term = I.term || S.term;
  // record BEFORE this registration: drop in-progress attempts of the same semester
  const sameSem = a => I.year && a.semester.term === term && a.semester.year === I.year;
  const baseAttempts = tr.attempts.filter(a => !(sameSem(a) && !a.grade && a.degree == null));
  const A0 = analyzeTranscript({ ...tr, attempts: baseAttempts }, f, d);
  const ge = A0.cgpa >= R.registration.regular.graduationMinGpa && (A0.remaining - A0.ipHours) <= R.registration.regular.graduationMax;
  const P = planFor(A0, f, d, { term, assumeIP: true, gradException: ge, interest: S.interest });
  const adv = advise(A0, f, d, { term, assumeIP: true, showCross: true });
  const reg = I.codes.filter(c => !(f.catalog[c].passFail));
  const regSet = new Set(reg);
  const prio = c => (adv.eligible.find(e => e.code === c) || { priority: 3 }).priority;
  const missingReq = P.picks.filter(c => !regSet.has(c) && prio(c) < 3);
  const missingEle = P.picks.filter(c => !regSet.has(c) && prio(c) === 3);
  const matched = P.picks.filter(c => regSet.has(c));
  const regHours = reg.reduce((s, c) => s + f.catalog[c].credits, 0);
  const cap = creditCap(A0, R, { term, gradException: ge, assumeIP: true });
  const notEligible = reg.filter(c => !adv.eligible.find(e => e.code === c)).map(c => {
    const b = adv.blocked.find(x => x.code === c), done = adv.completed.find(x => x.code === c);
    return { code: c, reasons: b ? b.reasons : done && done.st.passed ? [t('evPassed')] : [] };
  }).filter(x => x.reasons.length);
  const regElective = reg.filter(c => { const it = adv.eligible.find(e => e.code === c) || adv.blocked.find(e => e.code === c); return it && ['catEle', 'catUniE', 'catCross'].includes(it.cat); });
  const ctx = { A: A0, f, d, term, assumeIP: true, adv, cap, planTotal: regHours };
  return { term, year: I.year, A0, adv, plan: P, reg, regHours, cap, matched, missingReq, missingEle, notEligible, regElective, ctx, baseAttempts, ge };
}

function courseRequestFingerprint(o) { return sha256(JSON.stringify([o.studentId, o.term, o.year || '', [...o.missing].sort(), o.program, o.university])).then(h => h.slice(0, 16)); }
async function sendCourseRequest() {

    university: S.uniId, faculty: S.facId, program: S.depId, term: X.term, year: X.year || '', gradException: X.ge,
    studentId: activeStudentId(), email: S.session.email, demo: isStudentDemo(), studentNumber: st.number || '', studentName: st.name || '', enrollYear: st.enrollYear || '',
    missing, registered: X.reg, attempts: X.baseAttempts.map(a => [a.semester.label, a.rawCode, a.name, a.credits, a.degree, a.grade]) };

  download((isStudentDemo() ? 'DEMO-' : '') + 'course-request-' + idTag(activeStudentId()) + '-' + X.term.toLowerCase() + '.json', JSON.stringify(body, null, 2), 'application/json');

async function loadCourseDecision(file) {
  try {

    if (d.type !== 'ai-academic-advisor/course-decision') throw new Error(t('apBadFile'));
    const X = S.ibnX, missing = X.missingReq.filter(c => S.ibnMissChecked[c]);

function rebuildFromRequest(r) {
  const u = UNIVERSITIES.find(x => x.id === r.university); if (!u) throw new Error(t('advNoUni', { u: r.university }));
  const F = u.faculties.find(x => x.id === r.faculty) || u.faculties[0];
  const d = F.departments.find(x => x.id === r.program); if (!d) throw new Error(t('advNoProg', { p: r.program }));
  const f = d.rules ? { ...F, rules: d.rules, catalog: d.catalog, departments: [d], ownBylaw: d.bylawName } : F;
  const tr = parseTranscriptAOA([['Semester', 'Course Code', 'Course Name', 'Credit Hours', 'Degree', 'Grade'], ...r.attempts]);
  return { u, f, d, tr, A: analyzeTranscript(tr, f, d) };
}
function courseRequestState(r) {
  const B = rebuildFromRequest(r), { f, d, A } = B, R = f.rules;
  const adv = advise(A, f, d, { term: r.term, assumeIP: true, showCross: true });
  const cap = creditCap(A, R, { term: r.term, gradException: !!r.gradException, assumeIP: true });
  const regHours = r.registered.filter(c => f.catalog[c]).reduce((s, c) => s + f.catalog[c].credits, 0);
  const ctx = { A, f, d, term: r.term, assumeIP: true, adv, cap, planTotal: regHours + r.missing.reduce((s, c) => s + (f.catalog[c]?.credits || 0), 0) };
  return { ...B, adv, cap, regHours, ev: r.missing.filter(c => f.catalog[c]).map(c => courseEvidence(c, ctx)) };
}

let advisorEmailSending = false;
async function decide(kind) {
  if (advisorEmailSending || !advReview || advReview.kind === 'course') return;
  const { r, X, tampered } = advReview;
  const comment = $('adv-comment').value.trim();
  if (tampered) { alertToast(t('advTampered')); return; }
  if (kind === 'changes' && !comment) { alertToast(t('advNeedComment')); return; }
  if (kind === 'approved' && (!X.rows.every(x => x.ok) || X.overCap)) {
    alertToast(LANG === 'ar' ? 'لا يمكن اعتماد خطة بها مخالفات للائحة أو ساعات زائدة.' : 'The plan fails a bylaw check or the allowed credit limit. Request changes instead.');
    return;
  }
  const d = { type: 'ai-academic-advisor/decision', version: 1, fingerprint: r.fingerprint, decision: kind,
    comment, advisor: S.session.email, date: new Date().toISOString(), term: r.term, plan: r.plan, studentId: r.studentId };
  // Always retain the portable JSON decision as a fallback for manual delivery.
  download((r.demo ? 'DEMO-' : '') + 'advisor-decision-' + idTag(r.studentId) + '-' + r.term.toLowerCase() + '.json',
    JSON.stringify(d, null, 2), 'application/json');
  logUsage(kind === 'approved' ? 'approvalsGiven' : 'changesRequested');
  const feedback = $('adv-mail-status');
  feedback.style.color = 'var(--ink)';
  feedback.textContent = LANG === 'ar' ? 'جارٍ إرسال إشعار البريد الإلكتروني...' : 'Submitting the email notification...';
  advisorEmailSending = true;
  document.querySelectorAll('[data-decide]').forEach(b => b.disabled = true);
  try {
    // Send minimal decision data: the full student transcript and grades stay in the browser.
    const request = { type: r.type, version: r.version, fingerprint: r.fingerprint,
      university: r.university, faculty: r.faculty, program: r.program, term: r.term,
      plan: r.plan, studentId: r.studentId, email: r.email, demo: r.demo === true };
    const response = await client().functions.invoke('advisor-decision-email', { body: { request, decision: kind, comment } });
    if (response.error) {
      let message = response.error.message || 'Notification request failed';
      try { const details = await response.error.context?.json(); if (details?.error) message = details.error; } catch (_) {}
      throw new Error(message);
    }
    if (!response.data || !response.data.ok) throw new Error(response.data?.error || 'No email confirmation received');
    feedback.style.color = 'var(--emerald)';
    feedback.textContent = LANG === 'ar'
      ? 'قبلت خدمة البريد الإشعار إلى ' + response.data.recipient + (response.data.duplicate ? ' (أُرسل القرار من قبل)' : '') + '. راجع سجل Brevo للتأكد من التسليم.'
      : 'Email accepted for ' + response.data.recipient + (response.data.duplicate ? ' (already sent)' : '') + '. Check Brevo logs for delivery status.';
  } catch (e) {
    feedback.style.color = 'var(--rose)';
    feedback.textContent = (LANG === 'ar' ? 'تعذر إرسال إشعار البريد: ' : 'Email notification failed: ') + (e.message || String(e))
      + (LANG === 'ar' ? ' — تم تنزيل ملف القرار لإرساله يدويًا.' : ' — Decision JSON was downloaded for manual delivery.');
  } finally {
    advisorEmailSending = false;
    document.querySelectorAll('[data-decide]').forEach(b => b.disabled = false);
  }
}

  const order = CAL_FIELDS.map(k => c[k]).filter(Boolean);
  if (c.registrationStart && c.registrationEnd && c.registrationEnd < c.registrationStart) { $('cal-msg').innerHTML = `<span style="color:var(--rose)">${esc(t('calOrder'))}</span>`; return; }

/* ---- Grade-improvement suggestions (programs whose bylaw allows it, e.g. NMT/IMI Art. 17) ----
   Candidates: passed GPA courses below B that have not been improved yet. The gain is the CGPA
   change if the course is retaken with a B (3.0), keeping total registered hours unchanged. */
function improvementOptions() {
  const R = fac().rules, A = S.analysis;
  if (!R.improvement || !A) return null;
  const C = Object.values(A.courses).filter(c => !c.passFail && c.passed);
  const passCount = c => c.attempts.filter(a => a.kind === 'pass').length;
  const used = C.filter(c => passCount(c) > 1).length;
  const left = Math.max(0, R.improvement.maxCourses - used);
  const target = 3.0;
  const list = C.filter(c => passCount(c) === 1 && c.final.points < target)
    .map(c => ({ c, gain: (target - c.final.points) * c.credits / (A.gpaHours || 1) }))
    .sort((a, b) => b.gain - a.gain).slice(0, 6);
  return { used, left, list, art: R.improvement.article, max: R.improvement.maxCourses };
}

function drawMapLinks(sel, pre, unl) {

  return !st ? 'not taken' : st.passed ? 'passed' : st.inProgress ? 'in progress' : st.failedOpen ? 'failed (retake required)' : 'not passed';
}

function agentInstructions() {
  const u = uni(), f = dept() ? fac() : rawFac(), d = dept();
  return `You are the academic advising assistant of ${u.name}, ${f.name}${d ? ', program: ' + d.name : ''}.

STRICT RULES — follow all of them:
1. Use the tools for EVERY fact about this student or the bylaw: GPA, hours, eligibility, credit limits, prerequisites, grades, plans, rules. Never compute or estimate these yourself and never answer them from memory.
2. Quote numbers exactly as the tools return them. Do not round, recalculate or combine them into new figures.
3. For "can I take X" call check_course; for credit hours call credit_limit; for "what if I get…" call what_if_gpa; for "what should I register" call suggest_plan; for graduation progress call graduation_status; for "when will I graduate" or long-term planning call graduation_roadmap; for general rules call lookup_rule. Call get_student_record first when the student's own situation matters.
4. Cite the bylaw article returned by the tool for each rule you state (e.g. "Art. 9-c").
5. If a tool returns an error, or the bylaw data does not cover the question (fees, transfers, excuses, exam dates, timetables, anything not in the tools), say clearly that the system cannot confirm it and advise contacting the academic advisor or student affairs. Never guess.
6. Reply in the same language as the student's question (Arabic or English). Be short and practical: the direct answer first, then the reason, then what to do next.
7. Stay on academic registration and bylaw topics only.
8. End with one short line reminding that the academic advisor's approval is still required for registration decisions.
The semester the student is planning in the system is ${S.term}${termYearFor(S.term) ? ' ' + termYearFor(S.term) : ''}${autoTarget() && autoTarget().term === S.term ? ' (the next semester after the latest one in the transcript)' : ''}.`;
}

/* ---- provider adapter: the only part that depends on where the system runs ---- */
async function callModel(messages, tools, onText, signal) {
  if (sampleCap) {
    return sampleCap(messages, { tools, onText, signal, cache: false, modelTier: 'default' });
  }
  if (typeof window.ADVISOR_AI === 'function') {
    // Self-hosted deployment: window.ADVISOR_AI({messages, tools, onText, signal}) must send the
    // conversation and tool schemas to the university backend, run tool calls through tools[i].execute,
    // and resolve {text}. Keep the model API key on the server, never in this page.
    return window.ADVISOR_AI({ messages, tools, onText, signal });
  }
  throw { code: 'unavailable', message: 'No AI model is connected.' };
}

/* ---- verification: figures in the answer must come from tool results ---- */
function unverifiedFigures(answer, trace, question) {
  const toAscii = s => String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g, '.');
  const known = new Set();
  const collect = s => (toAscii(s).match(/\d+\.\d+/g) || []).forEach(n => { known.add(String(+n)); known.add((+n).toFixed(2)); known.add((+n).toFixed(1)); });
  trace.forEach(tc => collect(JSON.stringify(tc.result || '')));
  collect(question);
  return [...new Set((toAscii(answer).match(/\b\d+\.\d{1,2}\b/g) || []))].filter(n => !known.has(n) && !known.has(String(+n)));
}
function traceSummary(tc) {
  const r = tc.result || {}, i = tc.input || {};
  if (tc.error) return tc.name + ' → ' + tc.error;
  switch (tc.name) {
    case 'get_student_record': return 'Student record → CGPA ' + r.cgpa + ', ' + r.earned_hours + ' h earned, ' + r.remaining_hours + ' h remaining, ' + r.standing;
    case 'check_course': return 'Course check ' + r.code + ' (' + r.semester_checked + ') → ' + r.status + (r.blocking_reasons && r.blocking_reasons.length ? ': ' + r.blocking_reasons.join('; ') : '');
    case 'credit_limit': return 'Credit limit (' + r.semester + (i.hypothetical_cgpa != null ? ', CGPA ' + i.hypothetical_cgpa : '') + ') → max ' + r.max_hours + ' h, min ' + r.min_hours + ' h — ' + r.rule;
    case 'what_if_gpa': return 'What-if → CGPA ' + r.cgpa_before + ' → ' + r.cgpa_after + ', next limit ' + r.next_credit_limit + ' h' + (r.retake_caps_applied && r.retake_caps_applied.length ? '; ' + r.retake_caps_applied.join('; ') : '');
    case 'suggest_plan': return 'Suggested plan (' + r.semester + ') → ' + (r.courses || []).map(c => c.code).join(', ') + ' = ' + r.total_hours + '/' + r.credit_limit + ' h';
    case 'graduation_roadmap': return 'Graduation roadmap → ' + r.expected_graduation + ' (' + (r.semesters || []).length + ' semesters)';
    case 'graduation_status': return 'Graduation status → ' + r.earned_toward_graduation + '/' + r.total_required + ' h';
    case 'improvement_options': return 'Improvement options → ' + (r.allowed ? r.remaining + ' retakes left, ' + (r.candidates || []).length + ' candidates' : 'not allowed in this bylaw');
    case 'lookup_rule': return 'Bylaw rules: ' + r.topic;
    case 'find_course': return 'Course search "' + i.query + '" → ' + (Array.isArray(r) ? r.map(c => c.code).join(', ') || 'no match' : '');
  }
  return tc.name;
}

function renderQA(streaming) {
  if (!qaLinkMode) $('qa-sub').textContent = t('qaSub');
  $('qa-log').innerHTML = qaTurns.map(m => {
    if (m.role === 'user') return `<div class="qa-msg qa-user" dir="auto"><span class="qa-text">${esc(m.content)}</span></div>`;
    const checks = (m.trace || []);
    return `<div class="qa-msg qa-bot" dir="auto"><span class="qa-text">${esc(m.content || (checks.length ? t('qaChecking') : t('qaThinking')))}</span>
      ${m.unverified && m.unverified.length ? `<div class="alert alert-am small mt-2" dir="ltr">${esc(t('qaUnverified', { n: m.unverified.join(', ') }))}</div>` : ''}
      ${checks.length ? `<details class="small mt-2" dir="ltr"><summary class="cursor-pointer muted">${esc(t('qaHow', { n: checks.length }))}</summary><ul class="list-disc ps-5 mt-1 space-y-1">${checks.map(tc => `<li>${esc(traceSummary(tc))}</li>`).join('')}</ul></details>` :
        (m.content && !streaming && m.done ? `<div class="small muted mt-2" dir="ltr">${esc(t('qaNoChecks'))}</div>` : '')}
    </div>`;
  }).join('');
  $('qa-log').scrollTop = $('qa-log').scrollHeight;
  $('qa-send').disabled = !!streaming; $('qa-stop').classList.toggle('hidden', !streaming);
}
async function askQA(q) {
  q = (q || '').trim(); if (!q) return;
  $('qa-err').textContent = '';
  const history = qaTurns.filter(m => m.content).map(m => ({ role: m.role, content: m.content })).slice(-10);
  const msg = { role: 'assistant', content: '', trace: [], done: false };
  qaTurns.push({ role: 'user', content: q }, msg);
  renderQA(true); logUsage('questionsAsked');
  const tools = AGENT_TOOLS.map(tl => ({ name: tl.name, description: tl.description, ...(tl.inputSchema ? { inputSchema: tl.inputSchema } : {}),
    execute: input => {
      const rec = { name: tl.name, input: input || {} }; msg.trace.push(rec);
      try { rec.result = tl.run(input || {}); return rec.result; }
      catch (e) { rec.error = e.message || String(e); throw e; }
      finally { renderQA(true); }
    } }));
  qaCtl = new AbortController();
  try {
    const { text } = await callModel(
      [{ role: 'user', content: agentInstructions() }, { role: 'assistant', content: 'Understood. I will use the tools for every fact and cite the articles.' }, ...history, { role: 'user', content: q }],
      tools, ({ text }) => { msg.content = text; renderQA(true); }, qaCtl.signal);
    msg.content = text;
  } catch (e) {
    if (e && e.text) msg.content = e.text;
    else { qaTurns.splice(qaTurns.indexOf(msg) - 1, 2); }
    const E = t('qaErr'); const m = E[e && e.code] ?? E.other;
    if (m) $('qa-err').textContent = m;
    if (e && e.code === 'not_granted') $('qa-fab').classList.add('hidden');
  }
  msg.done = true;
  if (msg.content) msg.unverified = unverifiedFigures(msg.content, msg.trace, q);
  renderQA(false);
}

/* ---- Target semester chosen automatically from the transcript ----
   The next regular semester after the latest one in the record (summer is skipped unless the
   student picks it). Every semester type gets its real academic year for labels. */
function stepTerm(c) {
  const y = /^(\d{4})-(\d{4})$/.exec(c.year || '');
  if (c.term === 'Fall') return { term: 'Spring', year: c.year };
  if (c.term === 'Spring') return { term: 'Summer', year: c.year };
  return { term: 'Fall', year: y ? (+y[1] + 1) + '-' + (+y[2] + 1) : '' };
}
function lastSemester() {
  const s = S.transcript ? S.transcript.semesters.filter(x => TERM_ORDER[x.term] != null) : [];
  return s.length ? s[s.length - 1] : null;
}
function autoTarget() { const last = lastSemester(); if (!last) return null; const n = stepTerm(last); return n.term === 'Summer' ? stepTerm(n) : n; }
function termYearFor(type) {
  let cur = lastSemester(); if (!cur) return '';
  for (let i = 0; i < 6; i++) { cur = stepTerm(cur); if (cur.term === type) return cur.year; }
  return '';
}
function curTermLabel(term) { term = term || S.term; const y = termYearFor(term); return semLabel(term + (y ? ' ' + y : '')); }
function renderTermSelect() {
  const auto = autoTarget(), sel = $('sel-term');
  sel.innerHTML = ['Fall', 'Spring', 'Summer'].map(x => `<option value="${x}" ${x === S.term ? 'selected' : ''}>${esc(curTermLabel(x))}${auto && auto.term === x ? ' — ' + esc(t('termAuto')) : ''}</option>`).join('');
  const last = lastSemester();
  $('term-note').innerHTML = !auto ? '' : S.term === auto.term

function tryAdd(code) {
  const c = fac().catalog[code];
  if (S.plan.includes(code)) { S.plan = S.plan.filter(x => x !== code); return { ok: true }; }
  const cap = creditCap(S.analysis, fac().rules, { term: S.term, gradException: S.gradException, assumeIP: S.assumeIP });
  const tot = planHours() + c.credits;
  if (tot > cap.max) { logUsage('capLimitHits'); return { ok: false, msg: t('capBlocked', { code: c.displayCode || code, cr: c.credits, tot, max: cap.max, rule: t('capRule', { rule: cap.rule }) }) }; }

}

function templateRows() {
  const out = [['Semester', 'Course Code', 'Course Name', 'Credit Hours', 'Degree', 'Grade', 'Points']];

    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drag'); if (e.dataTransfer.files[0]) fn(e.dataTransfer.files[0]); });
    el.tabIndex = 0; el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $(inp).click(); } });

function alertToast(msg, kind) {
  const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'alert');
  d.innerHTML = `<div class="alert alert-${kind || 'ro'} panel" style="border:1px solid var(--line)">${esc(msg)}</div>`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 5000);
}
